<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="厂家资料：原件证据 → 候选 → 人工核对">
<title>厂家资料：原件证据 → 候选 → 人工核对</title>
<g fill="none" stroke="#475569" stroke-width="2">
<rect x="45" y="125" width="245" height="105" rx="5"/><text x="61" y="160" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">不可变PDF原件</text><text x="61" y="190" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">SHA-256 · 页码 · 裁选区域</text><rect x="355" y="125" width="250" height="105" rx="5"/><text x="371" y="160" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">规则 / OCR / 提供方</text><text x="371" y="190" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">仅处理所选型号与片段</text><rect x="665" y="125" width="250" height="105" rx="5"/><text x="681" y="160" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">有证据的候选</text><text x="681" y="190" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">原值 / 原单位 → SI</text><line x1="292" y1="177" x2="348" y2="177" stroke-dasharray="0"/><path d="M 340.0 182.0 L 348 177 L 340.0 172.0"/><line x1="607" y1="177" x2="658" y2="177" stroke-dasharray="0"/><path d="M 650.0 182.0 L 658 177 L 650.0 172.0"/><rect x="355" y="320" width="250" height="100" rx="5"/><text x="371" y="355" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">逐条人工核对</text><text x="371" y="385" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">接受 / 修改 / 拒绝</text><rect x="665" y="320" width="250" height="100" rx="5"/><text x="681" y="355" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">型号版本提案</text><text x="681" y="385" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">绑定审核版本与原件摘要</text><line x1="790" y1="232" x2="790" y2="280" stroke-dasharray="0"/><line x1="480" y1="280" x2="790" y2="280" stroke-dasharray="0"/><line x1="480" y1="280" x2="480" y2="318" stroke-dasharray="0"/><line x1="607" y1="370" x2="658" y2="370" stroke-dasharray="0"/><path d="M 650.0 375.0 L 658 370 L 650.0 365.0"/><text x="45" y="470" font-size="18" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">声明上限与实测事实保留不同口径；提取候选不能直接进入工程计算。</text>
</g>
<g fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif"><text x="45" y="55" font-size="26" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">厂家资料：原件证据 → 候选 → 人工核对</text><text x="45" y="515" font-size="13" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">main.py + 宿主datasheets：资料来源不等于工程批准，原件始终保留。</text></g>
<style>text{fill:#142b3e;stroke:none;font-family:Microsoft YaHei,sans-serif}</style>
</svg>
