<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="IEC 60287：损耗、径向热路与土壤互热">
<title>IEC 60287：损耗、径向热路与土壤互热</title>
<g fill="none" stroke="#475569" stroke-width="2">
<text x="50" y="110" font-size="22" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">电流 I → Rac(T) · Wc / Ws / Wd</text><line x1="60" y1="250" x2="900" y2="250" stroke-dasharray="8"/><text x="630" y="238" font-size="17" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">恒温地表 Ta</text><circle cx="220" cy="325" r="45"/><circle cx="440" cy="350" r="45"/><circle cx="220" cy="175" r="20"/><circle cx="440" cy="150" r="20"/><text x="164" y="402" font-size="17" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">电缆一 · Q₁</text><text x="384" y="430" font-size="17" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">电缆二 · Q₂</text><line x1="220" y1="196" x2="220" y2="279" stroke-dasharray="8"/><line x1="440" y1="171" x2="440" y2="304" stroke-dasharray="8"/><text x="555" y="270" font-size="19" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">镜像线源：Σ Qⱼ ρ/(2π) ln(r′/r)</text><text x="555" y="310" font-size="19" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">自项：ρ/(2π) acosh(h/a)</text><text x="555" y="350" font-size="19" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">T外表面 = Ta + Σ HᵢⱼQⱼ</text><text x="555" y="400" font-size="17" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">外表面 → T3 → 护套 → T1 → 导体</text><text x="50" y="471" font-size="16" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">排管另加管壁 / 空气隙热阻；回填另有公共修正；快速场只发布通过表面自检的口径。</text>
</g>
<g fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif"><text x="45" y="55" font-size="26" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">IEC 60287：损耗、径向热路与土壤互热</text><text x="45" y="515" font-size="13" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">group.py / soil.py：几何和总损耗来自同一次运行，场视图不改写载流量。</text></g>
<style>text{fill:#142b3e;stroke:none;font-family:Microsoft YaHei,sans-serif}</style>
</svg>
