<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="COMSOL对照：保持同一物理输入与参考口径">
<title>COMSOL对照：保持同一物理输入与参考口径</title>
<g fill="none" stroke="#475569" stroke-width="2">
<rect x="45" y="125" width="245" height="95" rx="5"/><text x="61" y="160" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">统一问题契约</text><text x="61" y="190" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">几何 · 材料 · 激励 · 边界</text><rect x="358" y="125" width="245" height="95" rx="5"/><text x="374" y="160" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">COMSOL适配</text><text x="374" y="190" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">真实求解器与许可证</text><rect x="670" y="125" width="245" height="95" rx="5"/><text x="686" y="160" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">复现结果</text><text x="686" y="190" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">热场 / 涡流 / 电热耦合</text><line x1="292" y1="172" x2="350" y2="172" stroke-dasharray="0"/><path d="M 342.0 177.0 L 350 172 L 342.0 167.0"/><line x1="605" y1="172" x2="662" y2="172" stroke-dasharray="0"/><path d="M 654.0 177.0 L 662 172 L 654.0 167.0"/><rect x="45" y="320" width="370" height="100" rx="5"/><text x="61" y="355" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">独立参考观测</text><text x="61" y="385" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">绑定参考数值、单位及原始来源</text><rect x="535" y="320" width="380" height="100" rx="5"/><text x="551" y="355" font-size="20" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">对照与追溯工件</text><text x="551" y="385" font-size="15" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">误差 · 源码摘要 · 计算输入摘要</text><line x1="417" y1="370" x2="529" y2="370" stroke-dasharray="0"/><path d="M 521.0 375.0 L 529 370 L 521.0 365.0"/><line x1="790" y1="222" x2="790" y2="318" stroke-dasharray="0"/><text x="45" y="469" font-size="18" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">无许可证、无真实运行或无参考值时明确拒绝；不生成替代数值。</text>
</g>
<g fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif"><text x="45" y="55" font-size="26" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">COMSOL对照：保持同一物理输入与参考口径</text><text x="45" y="515" font-size="13" fill="#142b3e" stroke="none" font-family="Microsoft YaHei, sans-serif">adapter.py / electrothermal.py：同一问题契约的商业求解器对照，不提供内置假结果。</text></g>
<style>text{fill:#142b3e;stroke:none;font-family:Microsoft YaHei,sans-serif}</style>
</svg>
