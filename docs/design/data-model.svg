<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1220" viewBox="0 0 1760 1220" role="img" aria-labelledby="title desc">
  <title id="title">CableSimPro 数据归属与版本关系</title>
  <desc id="desc">可编辑工程、研究配置和插件锁被取确定版本，形成一次运行的不可变输入。运行产生结果与文件；报告是引用运行的独立交付。保存新参数不覆盖旧运行。</desc>
  <rect width="1760" height="1220" fill="#ffffff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#202a28" letter-spacing="0">
    <text x="64" y="72" font-size="34" font-weight="700">CableSimPro · 数据归属与版本关系</text>
    <text x="64" y="111" font-size="18" fill="#62716b">工程可以继续编辑；运行输入一经接受就固定；交付只引用确定的结果。</text>
    <text x="1696" y="71" text-anchor="end" font-size="17" fill="#8b692f">V0.3 目标设计 / 非数据库现状图</text>
    <path d="M64 140 H1696" stroke="#ccd6d1"/>
    <text x="64" y="183" font-size="23" font-weight="700" fill="#26746b">01  可编辑的数据</text>
    <text x="650" y="183" font-size="23" font-weight="700" fill="#456d83">02  一次运行的固定输入</text>
    <text x="1250" y="183" font-size="23" font-weight="700" fill="#8b692f">03  只读结果与交付</text>

    <rect x="64" y="210" width="430" height="145" rx="6" fill="#f8fbfa" stroke="#7f9f94" stroke-width="1.5"/>
    <text x="88" y="252" font-size="25" font-weight="700">Workspace / 工程</text>
    <text x="88" y="289" font-size="19">结构 + 敷设 + 设计依据 + 来源</text>
    <text x="88" y="327" font-size="17" fill="#62716b">每次保存检查 revision，形成已保存版本</text>
    <rect x="64" y="398" width="430" height="145" rx="6" fill="#f8fbfa" stroke="#7f9f94" stroke-width="1.5"/>
    <text x="88" y="440" font-size="25" font-weight="700">Study / 研究定义</text>
    <text x="88" y="477" font-size="19">分析方法 + 配置 + study_revision</text>
    <text x="88" y="515" font-size="17" fill="#62716b">改研究配置，不自动修改工程参数</text>
    <rect x="64" y="586" width="430" height="145" rx="6" fill="#f8fbfa" stroke="#7f9f94" stroke-width="1.5"/>
    <text x="88" y="628" font-size="25" font-weight="700">PluginLock / 插件锁</text>
    <text x="88" y="665" font-size="19">插件版本 + 发行摘要 + 精确依赖</text>
    <text x="88" y="703" font-size="17" fill="#62716b">锁变化不等于电缆参数变化</text>

    <path d="M494 284 H640 M494 472 H640 M494 660 H640" stroke="#64716d" stroke-width="1.7" fill="none"/>
    <path d="M631 278 L644 284 L631 290 Z M631 466 L644 472 L631 478 Z M631 654 L644 660 L631 666 Z" fill="#64716d"/>
    <text x="518" y="267" font-size="16" fill="#62716b">取确定版本</text>
    <text x="518" y="455" font-size="16" fill="#62716b">取确定配置</text>
    <text x="518" y="643" font-size="16" fill="#62716b">取确定发行</text>

    <rect x="650" y="210" width="470" height="522" rx="6" fill="#f8fafc" stroke="#4d7891" stroke-width="1.8"/>
    <text x="676" y="252" font-size="25" font-weight="700">Run / 一次运行</text>
    <text x="676" y="285" font-size="18" fill="#54635d">同一次执行只对应一个逻辑 Run</text>
    <path d="M676 309 H1094" stroke="#c6d3dc"/>
    <text x="676" y="350" font-size="22" font-weight="700" fill="#456d83">InputSnapshot</text>
    <text x="676" y="393" font-size="19">工程版本 + 完整工程输入</text>
    <text x="676" y="431" font-size="19">研究版本 + 方法与配置</text>
    <text x="676" y="469" font-size="19">完整插件锁 + 准确发行版本</text>
    <text x="676" y="507" font-size="19">资料 / 资产 / 上游工件引用</text>
    <text x="676" y="545" font-size="19">单位 + 坐标 + 适用范围确认</text>
    <text x="676" y="583" font-size="19">planned_environment / 计划环境</text>
    <text x="676" y="621" font-size="18">input_digest；请求身份另存</text>
    <path d="M676 635 H1094" stroke="#c6d3dc"/>
    <text x="676" y="671" font-size="18" font-weight="700">接受后不再追随“最新工程”</text>
    <text x="676" y="707" font-size="17" fill="#62716b">重试创建新 Run；保留 retry_of 关系</text>
    <text x="650" y="776" font-size="18" fill="#54635d">执行状态可更新；固定输入不可被改写。</text>
    <text x="650" y="808" font-size="17" fill="#62716b">实际环境单独留证；不改写输入摘要。</text>
    <text x="650" y="837" font-size="16" fill="#62716b">freshness 按读取时的当前上下文判定。</text>

    <path d="M1120 284 H1238 M1120 472 H1238 M1120 660 H1238" stroke="#64716d" stroke-width="1.7" fill="none"/>
    <path d="M1229 278 L1242 284 L1229 290 Z M1229 466 L1242 472 L1229 478 Z M1229 654 L1242 660 L1229 666 Z" fill="#64716d"/>
    <text x="1137" y="267" font-size="16" fill="#62716b">验证后封存</text>
    <text x="1137" y="455" font-size="16" fill="#62716b">归属 / 摘要</text>
    <text x="1137" y="643" font-size="16" fill="#62716b">按 ID 引用</text>

    <rect x="1250" y="210" width="446" height="145" rx="6" fill="#ffffff" stroke="#8d9da7" stroke-width="1.5"/>
    <text x="1274" y="252" font-size="25" font-weight="700">Result / 数值结果</text>
    <text x="1274" y="289" font-size="19">物理量 + 单位 + 对象 + 方法范围</text>
    <text x="1274" y="327" font-size="17" fill="#62716b">成功不等于当前，也不等于工程认证</text>
    <rect x="1250" y="398" width="446" height="176" rx="6" fill="#ffffff" stroke="#8d9da7" stroke-width="1.5"/>
    <text x="1274" y="440" font-size="25" font-weight="700">Artifact / 计算工件</text>
    <text x="1274" y="477" font-size="19">几何 · 网格 · 场文件 · 诊断</text>
    <text x="1274" y="515" font-size="17" fill="#62716b">大小 / SHA-256 / schema / 坐标</text>
    <text x="1274" y="549" font-size="17" fill="#62716b">计算清单封存后，不用新文件覆盖</text>
    <rect x="1250" y="616" width="446" height="184" rx="6" fill="#fffdf8" stroke="#aa8d54" stroke-width="1.5"/>
    <text x="1274" y="658" font-size="25" font-weight="700">Delivery / 报告交付</text>
    <text x="1274" y="695" font-size="19">源 Run ID + renderer 版本 + 选项</text>
    <text x="1274" y="731" font-size="17" fill="#62716b">独立交付记录与报告文件清单</text>
    <text x="1274" y="770" font-size="18" fill="#8b692f">不重算，不向旧 Run 追加文件</text>

    <path d="M64 852 H1696" stroke="#ccd6d1"/>
    <text x="64" y="894" font-size="24" font-weight="700">例：保存新参数，不覆盖旧运行</text>
    <text x="1696" y="894" font-size="16" text-anchor="end" fill="#62716b">合成流程示例；没有计算或给出工程结论</text>
    <rect x="64" y="924" width="500" height="159" rx="6" fill="#ffffff" stroke="#a6b4ad"/>
    <text x="88" y="964" font-size="23" font-weight="700">R-A：来源 r12</text>
    <text x="88" y="1002" font-size="19">绝缘厚度 5.5 mm</text>
    <text x="88" y="1042" font-size="18" fill="#54635d">原结果与报告来源保持不变</text>
    <rect x="610" y="924" width="500" height="159" rx="6" fill="#ffffff" stroke="#a6b4ad"/>
    <text x="634" y="964" font-size="23" font-weight="700">R-B：来源 r13</text>
    <text x="634" y="1002" font-size="19">绝缘厚度 6.0 mm / Study s3</text>
    <text x="634" y="1042" font-size="18" fill="#54635d">保存并重新发起，创建新的运行</text>
    <rect x="1156" y="924" width="540" height="159" rx="6" fill="#f8fbfa" stroke="#80a69d"/>
    <text x="1180" y="964" font-size="23" font-weight="700">当前工程继续改到 r14</text>
    <text x="1180" y="1002" font-size="19">R-A、R-B 均不是 r14 的结果</text>
    <text x="1180" y="1042" font-size="18" fill="#54635d">可以明确查看和导出，但不能冒充当前解</text>
    <path d="M64 1121 H1696" stroke="#ccd6d1"/>
    <text x="64" y="1156" font-size="18" fill="#54635d">参数保存 ≠ 开始计算　　研究配置 ≠ 运行输入　　执行成功 ≠ 文件完整 ≠ 数值验证</text>
    <text x="64" y="1189" font-size="16" fill="#62716b">现有撤销历史不是永久版本档案；归档、统一 Study/Run 与 Delivery 均需按详细设计渐进实现。</text>
  </g>
</svg>
