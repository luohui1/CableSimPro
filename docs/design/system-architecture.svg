    <text x="64" y="1316" font-size="17" fill="#54635d">工程参数改变 ≠ 覆盖历史运行　　执行成功 ≠ 当前结果 ≠ 工程认证</text>
    <text x="64" y="1344" font-size="15" fill="#62716b">箭头为主要调用与存储流；原生进程不直连数据库。图中包含待实现能力，详见配套设计文档。</text>
