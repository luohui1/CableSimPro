    <rect x="944" y="1156" width="672" height="91" rx="5" fill="#fafbfa" stroke="#90a69b" stroke-width="1.5"/>
    <text x="968" y="1192" font-size="22" font-weight="700">文件工件 / 不可变快照</text>
