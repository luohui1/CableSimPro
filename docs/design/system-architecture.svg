<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1450" viewBox="0 0 1680 1450" role="img" aria-labelledby="title description">
  <title id="title">CableSimPro 系统架构设计草案</title>
  <desc id="description">工程工作台和工程助手共用应用协调层；六组领域模块通过统一能力与插件服务调用计算、建模和报告适配器。CableModelKit 保持独立。SQLite 保存元数据，工件存储保存不可变输入输出。</desc>
