name: Dual mode source snapshot
on:
  push:
    branches: ['feat/dual-mode-v071']
    paths: ['.github/workflows/dual-mode-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz --output=enterprise-source.tgz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-source
          path: enterprise-source.tgz
          retention-days: 2
