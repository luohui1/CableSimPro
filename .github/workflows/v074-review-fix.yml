name: Apply screenshot-reviewed light studio corrections
on:
  push:
    branches: ['feat/light-engineering-v074']
    paths: ['.github/workflows/v074-review-fix.yml']
permissions:
  contents: write
jobs:
  reviewed-source:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/light-engineering-v074'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply six exact source edits verified against their preimages
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib
          data=base64.b64decode('',validate=True)
          assert len(data)==2992 and hashlib.sha256(data).hexdigest()=='d14ebce26c5ce505c26f7a7e6017579c966bf53a8033515a8b213900daf0f01c'
          d=lzma.LZMADecompressor(memlimit=67108864);raw=d.decompress(data,max_length=20000)
          assert d.eof and len(raw)==7317
          changes=json.loads(raw)
          allowed={'frontend/src/CableModelView.tsx','frontend/src/engineering-visuals/CablePortrait.tsx','frontend/src/dual-mode/light-studio.css','frontend/src/dual-mode/AgentWorkspace.tsx','scripts/visuals/geometry.test.ts','frontend/pro-e2e/light-studio.spec.ts'}
          assert {c['path'] for c in changes}==allowed
          staged=[]
          for c in changes:
              p=pathlib.Path(c['path']);text=p.read_text(encoding='utf-8')
              assert hashlib.sha256(text.encode()).hexdigest()==c['base_sha256'],str(p)
              for a,b in c['edits']:
                  assert text.count(a)==1,(str(p),a[:30]);text=text.replace(a,b)
              text+=c['append']
              assert hashlib.sha256(text.encode()).hexdigest()==c['sha256'],str(p)
              staged.append((p,text))
          for p,text in staged:p.write_text(text,encoding='utf-8')
          print('Verified six reviewed product files. No weakened assertions or physics changes.')
          PY
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: node scripts/test_visual_geometry.mjs
      - run: npm run build
        working-directory: frontend
      - name: Commit product source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/CableModelView.tsx frontend/src/engineering-visuals/CablePortrait.tsx frontend/src/dual-mode/light-studio.css frontend/src/dual-mode/AgentWorkspace.tsx scripts/visuals/geometry.test.ts frontend/pro-e2e/light-studio.spec.ts
          git commit -m 'fix: fit candidate portraits, preserve readable callouts and accessible task navigation'
          git push origin HEAD:refs/heads/feat/light-engineering-v074
