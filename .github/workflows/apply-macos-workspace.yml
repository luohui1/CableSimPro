name: Apply reviewed macOS workspace
on:
  push:
    branches: ['merge/macos-workspace']
    paths:
      - 'tools/.macos-merge/**'
      - '.github/workflows/apply-macos-workspace.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed workspace patch
        shell: bash
        run: |
          cat tools/.macos-merge/part* | base64 -d | gzip -d > /tmp/macos-workspace.patch
          git apply --3way --index /tmp/macos-workspace.patch
          git rm -r tools/.macos-merge .github/workflows/apply-macos-workspace.yml
          python scripts/check_hygiene.py
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          git config user.name "CableSimPro Integration"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -m "design: integrate macOS-inspired professional workspace"
          git push origin HEAD:merge/macos-workspace
