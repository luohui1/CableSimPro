name: Publish reviewed enterprise milestone source
on:
  push:
    branches: ['feat/enterprise-design-v06']
    paths: ['.github/workflows/v06-publish.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/enterprise-design-v06'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply authored source only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          data=b''.join((root/f'.development/v06/{i:02}.bin').read_bytes() for i in range(7))
          assert len(data)==43456
          assert hashlib.sha256(data).hexdigest()=='1540f783089e1defbe4651102204c9e788d7bbe6258244c1573c7608f919be48'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(data,max_length=300000)
          assert decoder.eof and len(raw)==178456
          payload=json.loads(raw)
          assert len(payload['hashes'])==27
          for name in payload['hashes']:
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'backend','frontend','scripts','docs','tests','README.md'}
              assert p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.eot','.db','.sqlite'}
          subprocess.run(['git','apply','--check','-'],input=payload['patch'].encode(),check=True)
          subprocess.run(['git','apply','-'],input=payload['patch'].encode(),check=True)
          for name,h in payload['hashes'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==h,name
          print('Verified 27 authored source and test files. No credentials, user data or font binaries.')
          PY
      - name: Commit readable source on the isolated feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md backend frontend scripts docs tests
          git diff --cached --stat
          git commit -m 'feat: manufacturer product versions, reviewed selection and task-oriented engineering workspace'
          git push origin HEAD:refs/heads/feat/enterprise-design-v06
          echo "Published source $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
