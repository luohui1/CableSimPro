name: Light studio visual review
on:
  push:
    branches: ['feat/light-engineering-v074']
permissions:
  contents: read
concurrency:
  group: light-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: node scripts/test_visual_geometry.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright test light-studio.spec.ts --project=chromium
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-studio-review
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
