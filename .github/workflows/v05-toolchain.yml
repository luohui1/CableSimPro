name: V05 component toolchain
on:
  push:
    paths: ['.github/workflows/v05-toolchain.yml']
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm install --no-audit --no-fund @radix-ui/react-dialog@1.1.20 echarts@6.0.0 @axe-core/playwright@4.10.2
        working-directory: frontend
      - run: tar -czf v05-components.tgz -C frontend node_modules package-lock.json package.json
      - uses: actions/upload-artifact@v4
        with:
          name: v05-components
          path: v05-components.tgz
          retention-days: 7
