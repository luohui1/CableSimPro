name: Electrothermal plugin evidence
on:
  push:
    branches: ['feat/plugin-electrothermal-v01']
permissions:
  contents: read
concurrency:
  group: plugin-electrothermal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - run: python scripts/seal_plugin_catalog.py
      - run: python -m pytest --junitxml=artifacts/host-tests.xml
      - if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git diff --exit-code > artifacts/source-diff.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electrothermal-host
          retention-days: 7
          path: artifacts/
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install -r backend/requirements-dev.txt -r plugins/requirements-native.txt -r plugins/requirements-electrothermal.txt
      - run: python scripts/plugin_sdk.py verify
      - run: python scripts/seal_plugin_catalog.py
      - run: python -m pytest plugin-tests/test_native.py plugin-tests/test_cad_runtime.py plugin-tests/test_buried.py plugin-tests/test_electrothermal.py -v --junitxml=artifacts/native-tests.xml
      - if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          python -m pip freeze > artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electrothermal-native-${{ matrix.os }}
          retention-days: 7
          path: artifacts/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install -r backend/requirements-dev.txt -r plugins/requirements-native.txt -r plugins/requirements-electrothermal.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config=playwright.electrothermal.config.ts
        working-directory: frontend
      - if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=zip --output=artifacts/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electrothermal-browser
          retention-days: 7
          path: |
            artifacts/
            frontend/test-results-electrothermal/
            frontend/dist/
