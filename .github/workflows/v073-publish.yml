name: Publish reviewed unified studio source
on:
  push:
    branches: ['feat/unified-engineering-studio-v073']
    paths: ['.github/workflows/v073-publish.yml']
permissions:
  contents: write
jobs:
  reviewed-source:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/unified-engineering-studio-v073'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-verified authored source files excluding workflows
        run: |
          python - <<'PY'
          import hashlib,json,lzma,pathlib
          root=pathlib.Path.cwd()
          data=b''.join((root/f'.development/v073/{i:02}.bin').read_bytes() for i in range(3))
          assert len(data)==22048
          assert hashlib.sha256(data).hexdigest()=='5b5050be34e06d9e45b99dfcbce9f44dd1679ad1ffb6a72470ab76d3bbd3d77b'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(data,max_length=200000)
          assert decoder.eof and len(raw)==70990
          changes=json.loads(raw)
          assert len(changes)==27
          staged=[]
          for item in changes:
              rel=pathlib.PurePosixPath(item['path'])
              assert not rel.is_absolute() and '..' not in rel.parts
              assert rel.parts[0] in {'.github','.gitignore','README.md','docs','frontend','scripts','tests'}
              if rel.parts[0]=='.github':
                  assert str(rel)=='.github/workflows/ci.yml'
                  continue
              assert rel.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.eot','.db','.sqlite'}
              path=root/rel
              if 'new' in item:
                  assert not path.exists(),str(rel)
                  text=item['new']
              else:
                  old=path.read_text(encoding='utf-8')
                  assert hashlib.sha256(old.encode()).hexdigest()==item['base_sha256'],str(rel)
                  text=old
                  for start,end,replacement in reversed(item['edits']):
                      assert 0<=start<=end<=len(old)
                      text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==item['sha256'],str(rel)
              staged.append((path,text))
          for path,text in staged:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8')
          print('Verified 26 source files. Workflow changes remain separate authorized commits.')
          PY
      - name: Prepare compact local illustrations with provenance
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/prepare_builtin_assets.py
          python scripts/check_visual_assets.py
      - name: Verify frontend and engineering geometry
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          node ../scripts/test_visual_geometry.mjs
          npm run build
      - name: Commit source and derived assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore README.md docs frontend/package.json frontend/package-lock.json frontend/playwright.config.ts frontend/playwright.windows.config.ts frontend/pro-e2e frontend/src frontend/public/engineering scripts tests
          git diff --cached --stat
          git commit -m 'feat: unify light engineering modes with local illustrations, asset review and fitted 3D'
          git push origin HEAD:refs/heads/feat/unified-engineering-studio-v073
          echo "Published source $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
