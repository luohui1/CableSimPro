name: CAD natural-exit regression
on:
  push:
    branches: ['feat/plugin-workspace-integration-v01']
    paths: ['plugins/requirements-native.txt', 'plugin-tests/test_cad_runtime.py', '.github/workflows/plugin-cad-runtime.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install -r backend/requirements-dev.txt -r plugins/requirements-native.txt
      - run: python -m pytest plugin-tests/test_cad_runtime.py plugin-tests/test_native.py --junitxml=artifacts/cad-regression.xml
      - if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          python -m pip freeze > artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-regression-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 7
          path: artifacts/
