name: Plugin workspace integration evidence
on:
  push:
    branches: ['feat/plugin-workspace-integration-v01']
permissions:
  contents: read
concurrency:
  group: plugin-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - run: python -m pytest --junitxml=artifacts/host-tests.xml
      - if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-workspace-host
          retention-days: 7
          path: artifacts/
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: pip install -r backend/requirements-dev.txt -r plugins/requirements-native.txt
      - run: python scripts/plugin_sdk.py verify
      - run: python -m pytest plugin-tests/test_native.py -v --junitxml=artifacts/native-tests.xml
      - if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          pip freeze > artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-workspace-native-${{ matrix.os }}
          retention-days: 7
          path: artifacts/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: pip install -r backend/requirements-dev.txt -r plugins/requirements-native.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config=playwright.plugin-workspace.config.ts
        working-directory: frontend
      - if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=zip --output=artifacts/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-workspace-browser
          retention-days: 7
          path: |
            artifacts/
            frontend/test-results-plugin-workspace/
            frontend/dist/
