name: Workbench toolchain
on:
  push:
    branches: [feat/pro-workbench]
    paths: [.github/workflows/toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve MIT-licensed workbench components
        working-directory: frontend
        run: npm install --save-exact dockview-react konva react-konva @tanstack/react-table lucide-react --no-fund --no-audit
      - name: Resolve graph runtime and document parser
        run: python -m pip download --dest wheels 'langgraph>=1,<2' 'pypdf>=6,<7'
      - name: Archive toolchain
        run: |
          tar -czf frontend-toolchain.tgz -C frontend node_modules package.json package-lock.json
          tar -czf python-toolchain.tgz wheels
      - uses: actions/upload-artifact@v4
        with:
          name: pro-workbench-toolchain
          path: |
            frontend-toolchain.tgz
            python-toolchain.tgz
          retention-days: 7
