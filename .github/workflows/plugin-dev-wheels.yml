name: Numerical development dependencies
on:
  push:
    branches: ['feat/plugin-workspace-integration-v01']
    paths: ['.github/workflows/plugin-dev-wheels.yml']
permissions:
  contents: read
jobs:
  linux-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --no-deps -d artifacts/wheels gmsh==4.15.2 meshio==5.3.5 scikit-fem==12.0.2
      - run: |
          git rev-parse HEAD > artifacts/source-commit.txt
          sha256sum artifacts/wheels/* > artifacts/wheel-hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-development-wheels
          retention-days: 1
          path: artifacts/
