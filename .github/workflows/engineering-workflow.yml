name: Engineering workflow integration
on:
  push:
    branches: ['integration/engineering-workflow-v1']
    paths-ignore: ['.github/workflows/integration-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: engineering-workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - run: python -m pytest --junitxml=artifacts/backend-tests.xml
      - if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-backend
          path: artifacts/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config=playwright.workflow.config.ts
        working-directory: frontend
      - if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=zip -o artifacts/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-browser
          retention-days: 7
          path: |
            artifacts/
            frontend/test-results-workflow/
            frontend/dist/
