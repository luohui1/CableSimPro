name: Apply verified browser review corrections
on:
  push:
    branches: ['feat/engineering-workspace-v05']
    paths: ['.github/workflows/v05-review-fixes.yml']
permissions:
  contents: write
jobs:
  corrections:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/engineering-workspace-v05'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed edits and verify resulting source hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def change(name,a,b):
              p=Path(name);s=p.read_text();assert a in s,name;p.write_text(s.replace(a,b))
          change('frontend/src/StudioPanels.tsx',"const invalid=(text===''&&!field.nullable)","const invalid=!field.options&&((text===''&&!field.nullable)")
          change('frontend/src/StudioPanels.tsx','(field.max!==undefined&&Number(text)>field.max)));','(field.max!==undefined&&Number(text)>field.max))));')
          change('frontend/src/engineering-workspace.css','padding:0 11px 6px;color:#6f706e;font-weight:500','padding:0 11px 6px;color:#545553;font-weight:600')
          change('frontend/src/engineering-workspace.css','.eng-properties>header span{font-size:10px;color:#797978}', '.eng-properties>header span{font-size:11px;color:#555653}')
          change('frontend/src/EngineeringPanels.tsx',"import {useEffect,useState} from 'react';", "import {useEffect,useRef,useState} from 'react';")
          change('frontend/src/EngineeringPanels.tsx',' return <Dialog.Root open={open} onOpenChange={onOpenChange}>',' const returnFocus=useRef<HTMLElement|null>(null);\n return <Dialog.Root open={open} onOpenChange={onOpenChange}>')
          change('frontend/src/EngineeringPanels.tsx','<Dialog.Content className="eng-dialog">','<Dialog.Content className="eng-dialog" onOpenAutoFocus={()=>{returnFocus.current=document.activeElement instanceof HTMLElement?document.activeElement:null}} onCloseAutoFocus={event=>{event.preventDefault();returnFocus.current?.focus()}}>')
          change('frontend/src/CableModelView.tsx', "[view,setView]=useState('iso');", "[view,setView]=useState('iso'),[viewRevision,setViewRevision]=useState(0);")
          change('frontend/src/CableModelView.tsx','c.zoom=1;c.updateProjectionMatrix()',"c.zoom=view==='end'&&mode!=='exploded'?5:mode==='exploded'?1.2:1.8;c.updateProjectionMatrix()")
          change('frontend/src/CableModelView.tsx','},[view,geometryKey]);','},[view,geometryKey,viewRevision]);')
          change('frontend/src/CableModelView.tsx',"onClick={()=>setView(view==='iso'?'front':'iso')} title=\"恢复轴测视图\"","onClick={()=>{setView('iso');setViewRevision(r=>r+1)}} title=\"恢复轴测视图\"")
          change('frontend/pro-e2e/v05.spec.ts',"await expect(page.locator('.eng-assistant')).toHaveCount(0);", "await expect(page.locator('.eng-assistant')).toHaveCount(0);\n await expect(page.locator('.property.invalid')).toHaveCount(0);")
          expected={
              'frontend/src/StudioPanels.tsx':'211fadd5ae0c3ab1dc64d728d401d3f1d4e7d0263ecfb0dcbb07ac8b3080649f',
              'frontend/src/engineering-workspace.css':'644770f767276d26defad32ff4f86a9181fa7f92d861eeff21ba33931d015893',
              'frontend/src/EngineeringPanels.tsx':'46022706c999145c30ecf570b08b93413618231df8a4d3f4200065c076fffe92',
              'frontend/src/CableModelView.tsx':'b56f6742ba31b20f12e8a7315ded0cab326d888767219dc0d6e729c80184c761',
              'frontend/pro-e2e/v05.spec.ts':'2abe39260153e59cd0c0d294940d3d3aff4932790b3963a4e2b2c80e3e7b506f'}
          for name,h in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          print('Verified browser-review corrections; no test exclusions or weakened thresholds.')
          PY
      - name: Commit only the reviewed source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/StudioPanels.tsx frontend/src/engineering-workspace.css frontend/src/EngineeringPanels.tsx frontend/src/CableModelView.tsx frontend/pro-e2e/v05.spec.ts
          git commit -m 'fix: readable navigation, correct enum validation, focus return and useful model framing'
          git push origin HEAD:refs/heads/feat/engineering-workspace-v05
          echo "Source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
