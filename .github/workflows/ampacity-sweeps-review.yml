name: Ampacity sweep regression
on:
  push:
    branches: ['feat/ampacity-sweeps-v076']
permissions:
  contents: read
concurrency:
  group: ampacity-sweeps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Explicit Agent and ampacity sweep contracts
        run: python -m pytest tests/test_agent.py tests/test_ampacity_sweeps.py --junitxml=artifacts/sweep-backend.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Read-only comparison and CSV arithmetic
        run: node scripts/test_sweep_study.mjs
      - name: Production TypeScript and Vite build
        run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Real backend approval, comparison, exports and stale-result regression
        run: npx playwright test sweep-study.spec.ts --project=chromium --project=webkit
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ampacity-study-review
          path: |
            artifacts/
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
