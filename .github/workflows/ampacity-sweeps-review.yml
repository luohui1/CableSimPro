name: Ampacity sweep regression
on:
  push:
    branches: ['feat/ampacity-sweeps-v076']
permissions:
  contents: read
concurrency:
  group: ampacity-sweep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Explicit Agent and ampacity sweep contracts
        run: python -m pytest tests/test_agent.py tests/test_ampacity_sweeps.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Production TypeScript and Vite build
        run: npm run build
        working-directory: frontend
