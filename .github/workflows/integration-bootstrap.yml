name: Integration baseline bootstrap
on:
  push:
    branches: ['integration/engineering-workflow-v1']
    paths: ['.github/workflows/integration-bootstrap.yml']
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Capture exact frontend and Python dependencies for offline integration testing
        run: |
          mkdir -p artifacts/wheels
          python -m pip download --only-binary=:all: --dest artifacts/wheels -r backend/requirements-dev.txt
          tar -czf artifacts/frontend-dependencies.tgz -C frontend node_modules package-lock.json package.json
          git rev-parse HEAD > artifacts/source-commit.txt
          sha256sum artifacts/frontend-dependencies.tgz artifacts/wheels/* > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integration-bootstrap
          retention-days: 3
          path: artifacts/
