name: Apply AI task surface redesign
on:
  push:
    branches: ['feat/engineering-workspace-v05']
    paths: ['.github/workflows/v051-ai-surface.yml']
permissions:
  contents: write
jobs:
  redesign:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/engineering-workspace-v05'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replace sidebar assistant with centered task surface
        run: |
          python - <<'PY'
          from pathlib import Path
          def change(name,a,b):
              p=Path(name);s=p.read_text();assert a in s,name;p.write_text(s.replace(a,b))
          p='frontend/src/EngineeringWorkspace.tsx'
          change(p,',Menu,MessageSquare,PanelRightClose,',',Menu,PanelRightClose,')
          change(p,"if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();if(!busy)void s.history(e.shiftKey?'redo':'undo')}\n };", "if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();if(!busy)void s.history(e.shiftKey?'redo':'undo')}\n  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setAssistant(v=>!v)}\n };")
          change(p,"<button className={assistant?'assistant-trigger active':'assistant-trigger'} aria-expanded={assistant} onClick={()=>setAssistant(!assistant)}><MessageSquare size={17}/>工程助手</button>","")
          old="""{assistant&&<aside className=\"eng-assistant\" aria-label=\"工程助手面板\"><header><span><MessageSquare size={16}/>工程助手</span><button aria-label=\"关闭工程助手\" onClick={()=>setAssistant(false)}><X size={17}/></button></header><AgentPanel/></aside>}\n </div><footer className=\"eng-footbar\">"""
          new="""</div>{!assistant&&!generator&&!projectOpen&&!settingsOpen&&<button className=\"eng-ai-command\" aria-haspopup=\"dialog\" onClick={()=>setAssistant(true)}><span className=\"ai-mark\">AI</span><span className=\"ai-command-copy\"><strong>描述工程任务</strong><small>当前上下文：{info.name} · rev.{w.revision}</small></span><kbd>{navigator.platform.includes('Mac')?'⌘K':'Ctrl K'}</kbd></button>}<Modal open={assistant} onOpenChange={setAssistant} title=\"工程任务\" description={`当前上下文：${info.name} · 工程版本 ${w.revision}。先规划和审查，再改变工程或调用求解器。`} className=\"eng-ai-dialog\"><div className=\"eng-ai-workspace\"><AgentPanel/></div></Modal><footer className=\"eng-footbar\">"""
          change(p,old,new)
          p='frontend/src/EngineeringPanels.tsx'
          change(p,"export function Modal({open,onOpenChange,title,description,children}:{open:boolean;onOpenChange:(b:boolean)=>void;title:string;description:string;children:React.ReactNode}){", "export function Modal({open,onOpenChange,title,description,children,className=''}:{open:boolean;onOpenChange:(b:boolean)=>void;title:string;description:string;children:React.ReactNode;className?:string}){")
          change(p,'<Dialog.Content className="eng-dialog" onOpenAutoFocus=', '<Dialog.Content className={`eng-dialog ${className}`} onOpenAutoFocus=')
          p='frontend/pro-e2e/v05.spec.ts'
          change(p,"await expect(page.locator('.eng-assistant')).toHaveCount(0);", "await expect(page.locator('.eng-assistant')).toHaveCount(0);\n await expect(page.locator('.eng-ai-command')).toBeVisible();")
          change(p,"await expect(page.locator('.eng-assistant .diff-row').filter({hasText:'导体截面积'})).toContainText('400');", "await expect(page.locator('.eng-ai-workspace .diff-row').filter({hasText:'导体截面积'})).toContainText('400');")
          change(p,"await page.getByRole('button',{name:'关闭工程助手',exact:true}).click();", "await page.getByRole('button',{name:'关闭对话框',exact:true}).click();")
          change(p,"await page.getByRole('button',{name:'从资料生成工程变更提案',exact:false}).click();await expect(page.locator('.eng-assistant .proposal-card')).toContainText('0.0601');", "await page.getByRole('button',{name:'从资料生成工程变更提案',exact:false}).click();await expect(page.locator('.eng-ai-workspace .proposal-card')).toContainText('0.0601');")
          insert="""

test('AI is a centered task surface instead of a fixed engineering sidebar',async({page})=>{
 await expect(page.locator('.eng-ai-command')).toBeVisible();await expect(page.locator('.eng-ai-workspace')).toHaveCount(0);
 await page.locator('.eng-ai-command').click();const dialog=page.getByRole('dialog',{name:'工程任务'});await expect(dialog).toBeVisible();
 await expect(dialog).toContainText('当前上下文：电缆结构');await expect(page.locator('.eng-ai-workspace .agent-panel')).toBeVisible();
 await page.keyboard.press('Escape');await expect(dialog).toHaveCount(0);await expect(page.locator('.eng-ai-command')).toBeFocused();
 await page.keyboard.press(process.platform==='darwin'?'Meta+k':'Control+k');await expect(page.getByRole('dialog',{name:'工程任务'})).toBeVisible();
});
"""
          text=Path(p).read_text();marker="test('three dimensional geometry export includes metric dimensions and input snapshot'";assert marker in text;Path(p).write_text(text.replace(marker,insert+'\n'+marker))
          css=Path('frontend/src/engineering-workspace.css')
          css.write_text(css.read_text()+r'''

/* v0.5.1 — AI is a task surface, not a permanent sidebar. */
.eng-ai-command{position:fixed;z-index:55;left:calc(212px + (100vw - 212px)/2);bottom:47px;transform:translateX(-50%);width:min(680px,calc(100vw - 330px));min-height:58px!important;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:9px 13px!important;background:#fff!important;border:1px solid #d2d2d0!important;border-radius:16px!important;box-shadow:0 10px 30px rgba(28,28,27,.10),0 1px 4px rgba(28,28,27,.06);text-align:left;color:#313230!important}
.eng-ai-command:hover:not(:disabled){background:#fdfdfc!important;border-color:#b7b8b4!important;box-shadow:0 13px 34px rgba(28,28,27,.13),0 1px 4px rgba(28,28,27,.07)}
.ai-mark{font:600 11px var(--eng-mono);letter-spacing:.2px;border:1px solid #4b4c49;border-radius:999px;padding:5px 7px;color:#2c2d2b;flex-shrink:0;background:#f5f5f4}
.ai-command-copy{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}.ai-command-copy strong{font-size:13px;font-weight:550;color:#333431}.ai-command-copy small{font-size:10px;color:#6d6e6a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eng-ai-command kbd{font:10px var(--eng-mono);color:#6f706d;border:1px solid #dededc;border-bottom-color:#c9c9c6;background:#f7f7f6;border-radius:5px;padding:3px 6px}
.eng-ai-dialog{width:min(920px,calc(100vw - 48px))!important;max-width:none!important;height:min(780px,calc(100vh - 64px));max-height:none!important;padding:0!important;overflow:hidden;display:flex;flex-direction:column;border-radius:14px!important}
.eng-ai-dialog>header{padding:18px 22px 15px!important;border-bottom:1px solid #e2e2e0;flex-shrink:0}.eng-ai-dialog>header h2{font-size:19px!important}.eng-ai-dialog>header p{font-size:12px!important;color:#666864!important;margin-top:3px!important}
.eng-ai-workspace{flex:1;min-height:0;display:flex;background:#fbfbfa}.eng-ai-workspace .agent-panel{height:100%;width:100%;display:flex;flex-direction:column;background:#fbfbfa}.eng-ai-workspace .agent-heading{display:none}.eng-ai-workspace .agent-context{margin:12px 22px 0;font-size:11px;background:#f0f0ee;border-color:#dededb;color:#5f615d;padding:9px 11px}.eng-ai-workspace .agent-context b{color:#343633}.eng-ai-workspace .agent-scroll{flex:1;padding:0 max(24px,calc((100% - 760px)/2)) 20px}.eng-ai-workspace .agent-welcome{padding:34px 2px 10px}.eng-ai-workspace .agent-welcome h3{font-size:24px;line-height:1.55;letter-spacing:-.5px;color:#2f302e;max-width:600px}.eng-ai-workspace .agent-welcome>p{font-size:13px;color:#626460;max-width:650px}.eng-ai-workspace .agent-suggestions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.eng-ai-workspace .agent-suggestions button{font-size:12px;white-space:normal;text-align:left;justify-content:space-between;align-items:flex-start;min-height:72px;border-color:#ddddda;background:#fff;color:#4f514d;padding:11px}.eng-ai-workspace .agent-boundary{font-size:11px;color:#696b67}.eng-ai-workspace .agent-message{font-size:13px}.eng-ai-workspace .agent-message p{color:#41433f}.eng-ai-workspace .agent-message.user p{background:#efefed;border-radius:10px}.eng-ai-workspace .agent-composer{padding:14px max(24px,calc((100% - 760px)/2)) 18px;background:#fbfbfa;border-top:1px solid #e0e0de}.eng-ai-workspace .agent-composer textarea{height:86px;border-radius:12px;border-color:#bfc0bc;font-size:13px;background:#fff}.eng-ai-workspace .provider-row select{font-size:11px;background:#efefed;color:#555753}.eng-ai-workspace .composer-bottom{font-size:10px;color:#6b6d69}.eng-ai-workspace .proposal-card{border-color:#c8c9c5;border-radius:10px;background:#fff}.eng-ai-workspace .proposal-title{font-size:12px;color:#444642;background:#f0f0ee}.eng-ai-workspace .diff-row{font-size:12px;color:#50524e;padding:11px 13px}.eng-ai-workspace .review-buttons{background:#f3f3f1}.eng-ai-workspace .tool-record{background:#f3f3f1;border-color:#d9dad6}
@media(max-width:900px){.eng-ai-command{left:50%;width:min(620px,calc(100vw - 32px));bottom:43px}.eng-ai-dialog{width:calc(100vw - 22px)!important;height:calc(100vh - 28px)}.eng-ai-workspace .agent-suggestions{grid-template-columns:1fr}.eng-ai-workspace .agent-scroll,.eng-ai-workspace .agent-composer{padding-left:16px;padding-right:16px}}
''')
          PY
      - name: Commit reviewed UI surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/EngineeringWorkspace.tsx frontend/src/EngineeringPanels.tsx frontend/src/engineering-workspace.css frontend/pro-e2e/v05.spec.ts
          git commit -m 'fix: replace permanent AI sidebar with floating task bar and centered workspace'
          git push origin HEAD:refs/heads/feat/engineering-workspace-v05
