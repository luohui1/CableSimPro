name: CableDesignSystem development dependencies
on:
  push:
    branches: ['dev/cds-alpha2-dependencies']
    paths: ['.github/workflows/cds-development-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture animation dependencies without executing installation scripts
        shell: bash
        run: |
          mkdir -p cds-development artifacts/upstream
          cd cds-development
          npm init -y
          npm install --save-exact --ignore-scripts --no-audit --no-fund motion@13.2.0 react@19.3.0 react-dom@19.3.0 @types/react@19.3.0 @types/react-dom@19.3.0 esbuild@0.28.2 @playwright/test@1.63.0 @axe-core/playwright@4.13.0 typescript@5.9.3 animejs@latest lottie-web@latest
          npm ls --json > ../artifacts/dependency-tree.json
          node -e 'const fs=require("fs");const p=require("./package.json");fs.writeFileSync("../artifacts/resolved-versions.json",JSON.stringify({resolvedAt:new Date().toISOString(),node:process.version,dependencies:p.dependencies},null,2))'
          tar -czf ../artifacts/cds-development-dependencies.tgz package.json package-lock.json node_modules
          cd ..
          git clone --depth 1 https://github.com/n3r4zzurr0/svg-spinners.git /tmp/cds-svg-spinners
          git -C /tmp/cds-svg-spinners rev-parse HEAD > artifacts/upstream/svg-spinners-commit.txt
          git -C /tmp/cds-svg-spinners archive --format=tar HEAD | gzip > artifacts/upstream/svg-spinners-source.tar.gz
          sha256sum artifacts/cds-development-dependencies.tgz artifacts/upstream/* > artifacts/dependencies.sha256
          git rev-parse HEAD > artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cds-development-dependencies
          path: artifacts/
          retention-days: 7
