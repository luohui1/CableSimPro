name: Publish original engineering plates and reviewed UI
on:
  push:
    branches: ['feat/engineering-visual-assets-v072']
    paths: ['.github/workflows/v072-publish.yml']
permissions:
  contents: write
jobs:
  source-and-plates:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/engineering-visual-assets-v072'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-verified authored source changes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,lzma,pathlib
          root=pathlib.Path.cwd()
          data=b''.join((root/f'.development/v072/{i:02}.bin').read_bytes() for i in range(3))
          assert len(data)==16828
          assert hashlib.sha256(data).hexdigest()=='3c067fb2718125e9a2cb8bfe73c1ac2ae43c8a7f2bd48bda693e127d0692a658'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(data,max_length=150000)
          assert decoder.eof and len(raw)==55300
          changes=json.loads(raw)
          assert len(changes)==20
          staged=[]
          for item in changes:
              rel=pathlib.PurePosixPath(item['path'])
              assert not rel.is_absolute() and '..' not in rel.parts
              assert rel.parts[0] in {'README.md','docs','frontend','scripts'}
              assert rel.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.db','.sqlite'}
              path=root/rel
              if 'new' in item:
                  assert not path.exists(),str(rel)
                  text=item['new']
              else:
                  old=path.read_text(encoding='utf-8')
                  assert hashlib.sha256(old.encode()).hexdigest()==item['base_sha256'],str(rel)
                  text=old
                  for start,end,replacement in reversed(item['edits']):
                      assert 0<=start<=end<=len(old)
                      text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==item['sha256'],str(rel)
              if str(rel) in {'README.md','docs/VISUAL_V072.md'}:
                  text=text.replace('feat/cable-agent-studio-v072','feat/engineering-visual-assets-v072')
              staged.append((path,text))
          for path,text in staged:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8')
          print('Verified 20 authored files; adjusted documentation for isolated visual branch.')
          PY
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check display and engineering geometry separation
        run: node scripts/test_visual_geometry.mjs
      - name: Install headless renderer
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Render three original engineering illustrations
        run: node scripts/render_visual_assets.mjs
      - name: Typecheck and build illustrated application
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: v072-original-plates
          path: frontend/public/engineering/
          retention-days: 7
      - name: Commit source and assets on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs frontend/package.json frontend/package-lock.json frontend/playwright.config.ts frontend/playwright.windows.config.ts frontend/pro-e2e/visual-assets.spec.ts frontend/src frontend/public/engineering scripts
          git diff --cached --stat
          git commit -m 'feat: original cable illustrations, stronger engineering hierarchy and rich live 3D'
          git push origin HEAD:refs/heads/feat/engineering-visual-assets-v072
          echo "Published source and assets $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
