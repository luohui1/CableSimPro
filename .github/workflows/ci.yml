name: CableSimPro CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Hygiene and plugin catalog checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python scripts/check_hygiene.py
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - name: Plugin catalog seals match committed sources
        run: python scripts/seal_plugin_catalog.py
  native-plugins:
    name: Native plugins / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            plugins/requirements*.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: python -m pip install -r backend/requirements-dev.txt -r plugins/requirements-native.txt
      - run: python -m pytest plugin-tests --junitxml=artifacts/native-plugins.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugins-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 14
          path: artifacts/
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest --junitxml=artifacts/backend-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.python }}
          retention-days: 14
          path: artifacts/
  verified-demo:
    name: Package only after every check passes
    needs: [hygiene, native-plugins, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: CableSimPro-demo
          retention-days: 14
          path: artifacts/CableSimPro-demo.zip
          if-no-files-found: error
