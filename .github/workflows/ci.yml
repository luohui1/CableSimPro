name: CableSimPro CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Hygiene and plugin catalog checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      E2E_DEV: '0'
      E2E_DATABASE_SOURCE: ${{ github.workspace }}/.data/release/engineering.sqlite
      WORKBENCH_PHASE: before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python scripts/check_hygiene.py
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - name: Plugin catalog seals match committed sources
        run: python scripts/seal_plugin_catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            studio/package-lock.json
      - name: Generate the existing CAD gallery inputs required by TypeScript
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1 fonts-arphic-uming
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry
          .venv/bin/python frontend/src/features/cad/prepare-fixtures.py
      - name: Generate the existing CAD gallery inputs required by TypeScript on Windows
        if: runner.os == 'Windows'
        run: |
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry
          .venv/Scripts/python.exe -X utf8 frontend/src/features/cad/prepare-fixtures.py
      - name: Frontend style rules, types and unit tests
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run check:styles
          npx tsc -b
          npm test
      - name: Restore the pinned OCCT runtime cache
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: .data/occt-toolchain/viewer/
          key: occt-runtime-${{ hashFiles('frontend/src/features/cad/native/**') }}
          enableCrossOsArchive: true
      - name: Build and validate OCCT from the locked sources
        if: ${{ matrix.os == 'windows-latest' }}
        id: occt-runtime
        run: |
          python frontend/src/features/cad/native/prepare.py --jobs 2
          node frontend/src/features/cad/prepare-runtime.mjs --check-only
      - name: Cache the validated OCCT runtime
        if: ${{ matrix.os == 'windows-latest' && steps.occt-runtime.outcome == 'success' && steps.occt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .data/occt-toolchain/viewer/
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      - name: Build the production frontend with verified CAD assets
        if: ${{ matrix.os == 'windows-latest' }}
        working-directory: frontend
        run: npm run build
      - name: Upload the verified OCCT runtime for this checkout
        if: ${{ !cancelled() && matrix.os == 'windows-latest' && steps.occt-runtime.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: occt-runtime-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .data/occt-toolchain/viewer/build.json
            .data/occt-toolchain/viewer/occt-viewer.js
            .data/occt-toolchain/viewer/occt-viewer.wasm
            .data/occt-toolchain/viewer/LICENSE_LGPL_21.txt
            .data/occt-toolchain/viewer/OCCT_LGPL_EXCEPTION.txt
      - name: Wait for the verified runtime from this workflow when the cache is empty
        if: ${{ matrix.os == 'ubuntu-latest' && steps.occt-cache.outputs.cache-hit != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const name = `occt-runtime-${context.sha}`;
            const until = Date.now() + 40 * 60 * 1000;
            while (Date.now() < until) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, per_page: 100
              });
              if (data.artifacts.some(artifact => artifact.name === name && !artifact.expired)) {
                core.info(`Verified runtime is available from this same workflow: ${name}`);
                return;
              }
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: context.runId, per_page: 100
              });
              const build = jobs.data.jobs.find(job => job.name === 'Hygiene and plugin catalog checks (windows-latest)');
              if (build?.status === 'completed') {
                throw new Error(`Windows runtime build ended with ${build.conclusion} without the verified artifact.`);
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Timed out waiting for the same-workflow verified OCCT runtime.');
      - name: Download the same-workflow OCCT runtime
        if: ${{ matrix.os == 'ubuntu-latest' && steps.occt-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: occt-runtime-${{ github.sha }}
          path: .data/occt-toolchain/viewer/
      - name: Prepare the production frontend for browser verification
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          node frontend/src/features/cad/prepare-runtime.mjs --check-only
          node frontend/src/features/cad/prepare-runtime.mjs
          npm --prefix frontend run build
          echo "E2E_DEV=0" >> "$GITHUB_ENV"
          echo "Ubuntu browser walkthroughs use the production build with verified OCCT assets." >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare real isolated workbench data and Chromium
        if: ${{ matrix.os == 'ubuntu-latest' }}
        id: workbench-environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1 fonts-noto-cjk
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry --with-tests
          mkdir -p .data/release .data/workbench-walk/logs
          .venv/bin/python frontend/scripts/seed-engineering-demo.py --release --database .data/release/engineering.sqlite
          cd frontend
          if [ ! -x /usr/bin/google-chrome ]; then npx playwright install --with-deps chromium; fi
      - name: Walk ampacity research at both screen sizes
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        env:
          WORKBENCH_PHASE: after
        run: npm run test:workbench-research 2>&1 | tee ../.data/workbench-walk/logs/research.log
      - name: Preserve the research walkthrough before continuing
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-research
          retention-days: 14
          include-hidden-files: true
          path: |
            .data/workbench-walk/after/research/
            .data/workbench-walk/logs/research.log
      - name: Walk type design at both screen sizes
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:workbench-types 2>&1 | tee ../.data/workbench-walk/logs/types.log
      - name: Preserve the type walkthrough before continuing
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-types
          retention-days: 14
          include-hidden-files: true
          path: |
            .data/workbench-walk/before/types/
            .data/workbench-walk/after/types/
            .data/workbench-walk/logs/types.log
      - name: Walk resources at both screen sizes
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:workbench-resources 2>&1 | tee ../.data/workbench-walk/logs/resources.log
      - name: Walk simulation preflight without submitting a solver
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:workbench-simulation 2>&1 | tee ../.data/workbench-walk/logs/simulation.log
      - name: Upload the four walkthroughs before the broader audits
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-walk
          retention-days: 14
          include-hidden-files: true
          path: .data/workbench-walk/
      - name: Audit rendering performance in an independent browser session
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        env:
          PERFORMANCE_PASS: after
        run: npm run test:performance 2>&1 | tee ../.data/workbench-walk/logs/performance.log
      - name: Upload the completed performance audit before the full text traversal
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-performance
          retention-days: 14
          include-hidden-files: true
          path: |
            .data/fix-round/shared-shell/performance/
            .data/workbench-walk/logs/performance.log
      - name: Audit visible text and interface regularity on the same full walkthrough
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        env:
          REGULARITY_WITH_VISIBLE: '1'
          VISIBLE_TEXT_PASS: after
          REGULARITY_PASS: after
        run: npm run test:regularity 2>&1 | tee ../.data/workbench-walk/logs/visible-text-and-regularity.log
      - name: Upload workbench screenshots, real request records and audits
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-evidence
          retention-days: 14
          include-hidden-files: true
          path: |
            .data/workbench-walk/
            .data/fix-round/shared-shell/visible-text/
            .data/fix-round/shared-shell/regularity/
            .data/fix-round/shared-shell/performance/
      - name: Cable Studio types, build and real-flow tests
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        working-directory: studio
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
  native-plugins:
    name: Native plugins / Slurm dg83
    runs-on: [self-hosted, linux, cablesim-hpc]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Submit frozen native regressions to dg83
        run: python scripts/run_plugin_tests_hpc.py --profile "$CABLESIM_HPC_PROFILE" --wall-seconds 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugins-slurm
          retention-days: 14
          path: .data/hpc/native-tests/
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Prepare the empty runtime directory used during application import
        run: python -c "from pathlib import Path; Path('.data').mkdir(exist_ok=True)"
      - name: Prepare the declared geometry environment separately from the host Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry --with-tests
      - run: python -m pytest -n "$(python -c 'import os; print(min(3, os.cpu_count() or 1))')" --junitxml=artifacts/backend-${{ matrix.python }}.xml
      - name: Run direct CAD assertions in the declared geometry environment
        run: .venv/bin/python -m pytest -n 0 tests/test_cable_geometry.py tests/test_installation_scene.py tests/test_geometry_preview.py --junitxml=artifacts/cad-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.python }}
          retention-days: 14
          path: artifacts/
  verified-demo:
    name: Offline release installation / ${{ matrix.os }}
    # These are verification artifacts, not published releases. Build beside
    # every existing check so a slow or failed test cannot suppress diagnosis;
    # the pull request still requires all non-native checks to pass.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            plugins/cablesim.cable-geometry/src/requirements.txt
      - name: Verify Windows firewall and loopback before expensive builds
        if: runner.os == 'Windows'
        run: python scripts/verify_installation.py --windows-firewall-preflight --output artifacts/firewall-preflight-Windows
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build and evidence inspection dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install Linux runtime system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1
      - uses: actions/cache/restore@v4
        id: occt
        with:
          path: |
            .data/occt-toolchain
            .data/occt-downloads
            frontend/src/features/cad/node_modules/.cache/cablesim-occt
          key: release-occt-${{ runner.os }}-${{ hashFiles('frontend/src/features/cad/native/**', 'frontend/src/features/cad/prepare-runtime.mjs', 'scripts/prepare_release_frontend.py', 'scripts/release_toolchains.json') }}
      - name: Prepare verified OCCT assets from pinned sources
        run: python scripts/prepare_release_frontend.py --jobs 4 --download-cache .data/occt-downloads
      - name: Preserve verified OCCT assets before installation checks
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .data/occt-toolchain
            .data/occt-downloads
            frontend/src/features/cad/node_modules/.cache/cablesim-occt
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - name: Build the shipped frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build:release -- --outDir ../.data/release/frontend --emptyOutDir
      - name: Build a platform-specific offline release archive
        run: python scripts/build_release.py --frontend-dist .data/release/frontend --output artifacts/CableSimPro-${{ runner.os }}.zip
      - name: Install, calculate and export with only loopback networking (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          release_python="$(command -v python)"
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            "$release_python" scripts/verify_installation.py \
            --archive artifacts/CableSimPro-Linux.zip \
            --output artifacts/installation-Linux \
            --require-offline linux-network-namespace
      - name: Install, calculate and export with external traffic blocked (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The gate installs per-program firewall rules for its Python and the
          # installed Python before pip/host/plugin execution, records the real
          # application filters, and removes rules/restores profiles in finally.
          # The runner agent retains its connection while application egress is blocked.
          python scripts/verify_installation.py `
            --archive artifacts/CableSimPro-Windows.zip `
            --output artifacts/installation-Windows `
            --require-offline windows-firewall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CableSimPro-release-${{ runner.os }}
          retention-days: 14
          path: |
            artifacts/CableSimPro-${{ runner.os }}.zip
            artifacts/CableSimPro-${{ runner.os }}.zip.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CableSimPro-installation-${{ runner.os }}
          retention-days: 14
          path: |
            artifacts/installation-${{ runner.os }}/
            artifacts/firewall-preflight-${{ runner.os }}/
          if-no-files-found: error
