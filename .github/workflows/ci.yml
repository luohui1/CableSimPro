name: CableSimPro CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Hygiene and plugin catalog checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python scripts/check_hygiene.py
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - name: Plugin catalog seals match committed sources
        run: python scripts/seal_plugin_catalog.py
  scene-contracts:
    name: Scene contracts and Blender exchange
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Frontend token and styling rules
        run: npm run check:styles
        working-directory: frontend
      - name: Strict visualization module type check
        run: npm run check:visualization
        working-directory: frontend
      - name: Install Chromium for real React and WebGL regression
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real React WebGL thermal-network and history interactions
        run: npm run test:visualization-browser
        working-directory: frontend
      - name: Shared controls, IME editing, dialogs and responsive workspace
        run: npm run test:ui-controls
        working-directory: frontend
      - name: Install the display-authoring tool for the real GLB round trip
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH /usr/bin/blender --version
      - name: Validate exchange and actual Blender GLB coordinates and identity
        env:
          CABLESIM_BLENDER: /usr/bin/blender
        # Distro Blender must use the distro Python/NumPy, not setup-python shared libraries.
        run: env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH /usr/bin/python3 -m unittest discover -s tests -p test_scene_exchange.py -v
      - name: Generate declared native CAD gallery fixtures for full type check
        if: ${{ !cancelled() }}
        # Real native gallery geometry, not empty JSON stubs or solver results.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libgl1 libxrender1
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-dev.txt
          .venv/bin/python scripts/prepare_plugin_environment.py cablesim.cable-geometry --with-tests
          .venv/bin/python frontend/src/features/cad/prepare-fixtures.py
      - name: Full frontend type check including study-route integration
        if: ${{ !cancelled() }}
        run: npx tsc --project tsconfig.json --noEmit --pretty false
        working-directory: frontend
      - name: Production frontend routes with real API and fresh input-only database
        if: ${{ !cancelled() }}
        run: npm run test:frontend-polish
        working-directory: frontend
      - name: Optional visual evidence archive
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        # Evidence upload is optional; no test or type-check failure is ignored.
        continue-on-error: true
        with:
          name: visualization-browser-evidence
          retention-days: 7
          path: frontend/test-results/visualization/
          if-no-files-found: ignore
  native-plugins:
    name: Native plugins / Slurm dg83
    runs-on: [self-hosted, linux, cablesim-hpc]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Submit frozen native regressions to dg83
        run: python scripts/run_plugin_tests_hpc.py --profile "$CABLESIM_HPC_PROFILE" --wall-seconds 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugins-slurm
          retention-days: 14
          path: .data/hpc/native-tests/
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Prepare the declared geometry environment separately from the host Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry --with-tests
      - run: python -m pytest --junitxml=artifacts/backend-${{ matrix.python }}.xml
      - name: Run direct CAD assertions in the declared geometry environment
        run: .venv/bin/python -m pytest tests/test_cable_geometry.py tests/test_installation_scene.py tests/test_geometry_preview.py --junitxml=artifacts/cad-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.python }}
          retention-days: 14
          path: artifacts/
  verified-demo:
    name: Package only after every check passes
    needs: [hygiene, scene-contracts, native-plugins, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: CableSimPro-demo
          retention-days: 14
          path: artifacts/CableSimPro-demo.zip
          if-no-files-found: error
