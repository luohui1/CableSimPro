name: CableSimPro CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest --junitxml=artifacts/backend-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.python }}
          path: artifacts/
  frontend-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - name: Resolve frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build
      - name: Verify local illustration sources and engineering geometry
        run: |
          python scripts/check_visual_assets.py
          node scripts/test_visual_geometry.mjs
      - name: Install browser engines
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise real UI and backend
        working-directory: frontend
        run: npm run test:e2e
      - name: Build downloadable demo bundle
        run: python scripts/package_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-and-screenshots
          path: |
            frontend/playwright-report/
            frontend/test-results/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CableSimPro-demo
          path: artifacts/CableSimPro-demo.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-frontend-lock
          path: frontend/package-lock.json
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install chromium msedge
        working-directory: frontend
      - name: Windows Chromium / Edge, input, layout and actual font inspection
        run: npx playwright test --config=playwright.windows.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-report
          retention-days: 14
          path: |
            frontend/playwright-report-windows/
            frontend/test-results-windows/
