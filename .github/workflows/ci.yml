name: CableSimPro CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest --junitxml=artifacts/backend-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.python }}
          retention-days: 14
          path: artifacts/
  browser:
    name: UI / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: chromium-1, os: ubuntu-latest, project: chromium, shard: '1/2', config: playwright.config.ts, engines: chromium}
          - {id: chromium-2, os: ubuntu-latest, project: chromium, shard: '2/2', config: playwright.config.ts, engines: chromium}
          - {id: webkit, os: ubuntu-latest, project: webkit, shard: '1/1', config: playwright.config.ts, engines: webkit}
          - {id: mobile-webkit, os: ubuntu-latest, project: mobile-webkit, shard: '1/1', config: playwright.config.ts, engines: webkit}
          - {id: win-100-1, os: windows-latest, project: windows-chromium-1, shard: '1/2', config: playwright.windows.config.ts, engines: chromium}
          - {id: win-100-2, os: windows-latest, project: windows-chromium-1, shard: '2/2', config: playwright.windows.config.ts, engines: chromium}
          - {id: win-125-1, os: windows-latest, project: windows-chromium-1.25, shard: '1/2', config: playwright.windows.config.ts, engines: chromium}
          - {id: win-125-2, os: windows-latest, project: windows-chromium-1.25, shard: '2/2', config: playwright.windows.config.ts, engines: chromium}
          - {id: win-150-1, os: windows-latest, project: windows-chromium-1.5, shard: '1/2', config: playwright.windows.config.ts, engines: chromium}
          - {id: win-150-2, os: windows-latest, project: windows-chromium-1.5, shard: '2/2', config: playwright.windows.config.ts, engines: chromium}
          - {id: edge-125-1, os: windows-latest, project: windows-edge-1.25, shard: '1/2', config: playwright.windows.config.ts, engines: msedge}
          - {id: edge-125-2, os: windows-latest, project: windows-edge-1.25, shard: '2/2', config: playwright.windows.config.ts, engines: msedge}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: node scripts/test_visual_geometry.mjs
      - run: npm run build
        working-directory: frontend
      - name: Install this browser engine only
        run: npx playwright install --with-deps ${{ matrix.engines }}
        working-directory: frontend
      - name: Run every test in the assigned isolated shard
        run: npx playwright test --config=${{ matrix.config }} --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.id }}
          retention-days: 14
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/playwright-report-windows/
            frontend/test-results-windows/
  verified-demo:
    name: Package only after the complete verification matrix
    needs: [backend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: ui-*
          path: verification
      - name: Reject missing, skipped or duplicate browser cases
        run: |
          mkdir -p artifacts
          python scripts/verify_ci_matrix.py verification > artifacts/verification-matrix.json
          cat artifacts/verification-matrix.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/package_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: CableSimPro-demo
          retention-days: 14
          path: artifacts/CableSimPro-demo.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: verification-matrix
          retention-days: 14
          path: artifacts/verification-matrix.json
