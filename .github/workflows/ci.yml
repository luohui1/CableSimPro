name: CableSimPro CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Hygiene and plugin catalog checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python scripts/check_hygiene.py
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - name: Plugin catalog seals match committed sources
        run: python scripts/seal_plugin_catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            studio/package-lock.json
      - name: Generate the existing CAD gallery inputs required by TypeScript
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1 fonts-arphic-uming
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry
          .venv/bin/python frontend/src/features/cad/prepare-fixtures.py
      - name: Frontend style rules, types and unit tests
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run check:styles
          npx tsc -b
          npm test
      - name: Cable Studio types, build and real-flow tests
        working-directory: studio
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Generate API types from an isolated release host
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHON: ${{ github.workspace }}/.venv/bin/python
          E2E_DATABASE_SOURCE: ${{ github.workspace }}/.data/release/engineering.sqlite
        run: |
          set -euo pipefail
          mkdir -p .data/release .tmp/fusion-openapi
          git rev-parse HEAD | tee .tmp/fusion-openapi/checkout.txt
          .venv/bin/python frontend/scripts/seed-engineering-demo.py --release --database .data/release/engineering.sqlite 2>&1 | tee .tmp/fusion-openapi/seed.log
          node frontend/scripts/isolated-e2e.mjs generate-api.mjs 2>&1 | tee .tmp/fusion-openapi/generate.log
          cp frontend/src/api/generated/schema.ts frontend/src/api/generated/endpoints.ts .tmp/fusion-openapi/
          cp .data/frontend-integration/openapi.json .tmp/fusion-openapi/
      - name: Upload formal host API files and generation logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-host-openapi
          retention-days: 14
          include-hidden-files: true
          path: .tmp/fusion-openapi/
  native-plugins:
    name: Native plugins / Slurm dg83
    runs-on: [self-hosted, linux, cablesim-hpc]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Submit frozen native regressions to dg83
        run: python scripts/run_plugin_tests_hpc.py --profile "$CABLESIM_HPC_PROFILE" --wall-seconds 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugins-slurm
          retention-days: 14
          path: .data/hpc/native-tests/
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Prepare the empty runtime directory used during application import
        run: python -c "from pathlib import Path; Path('.data').mkdir(exist_ok=True)"
      - name: Prepare the declared geometry environment separately from the host Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry --with-tests
      - run: python -m pytest -n "$(python -c 'import os; print(min(3, os.cpu_count() or 1))')" --junitxml=artifacts/backend-${{ matrix.python }}.xml
      - name: Run direct CAD assertions in the declared geometry environment
        run: .venv/bin/python -m pytest -n 0 tests/test_cable_geometry.py tests/test_installation_scene.py tests/test_geometry_preview.py --junitxml=artifacts/cad-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.python }}
          retention-days: 14
          path: artifacts/
  verified-demo:
    name: Offline release installation / ${{ matrix.os }}
    # These are verification artifacts, not published releases. Build beside
    # every existing check so a slow or failed test cannot suppress diagnosis;
    # the pull request still requires all non-native checks to pass.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            plugins/cablesim.cable-geometry/src/requirements.txt
      - name: Verify Windows firewall and loopback before expensive builds
        if: runner.os == 'Windows'
        run: python scripts/verify_installation.py --windows-firewall-preflight --output artifacts/firewall-preflight-Windows
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build and evidence inspection dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Real HTTP requests, graceful stop and immediate same-port restart
        run: >-
          python -m pytest -n 0 tests/test_release_installation.py
          -k "restarts_immediately_after_requests or port_probe_rejects_live_listener"
          --junitxml=artifacts/release-restart-${{ runner.os }}.xml
      - name: Install Linux runtime system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1
      - name: Prepare real host, geometry and browser dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry
          npm --prefix frontend ci --ignore-scripts
          cd frontend
          npx playwright install --with-deps chromium
      - name: Generate a fresh release database and run release workflows
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .data/release .tmp/library-import-walk
          .venv/bin/python frontend/scripts/seed-engineering-demo.py --release --database .data/release/engineering.sqlite 2>&1 | tee .tmp/library-import-walk/seed.log
          .venv/bin/python scripts/verify_release_workflows.py --output .tmp/library-release-acceptance 2>&1 | tee .tmp/library-import-walk/release.log
      - name: Walk real imports, series operations and public comparisons at both sizes
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        working-directory: frontend
        env:
          E2E_DEV: '1'
          E2E_DATABASE_SOURCE: ${{ github.workspace }}/.data/release/engineering.sqlite
          LIBRARY_IMPORT_EVIDENCE: ${{ github.workspace }}/.tmp/library-import-walk
        run: npm run test:library-import 2>&1 | tee ../.tmp/library-import-walk/browser.log
      - name: Retain every public catalogue value and deviation
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from backend.kernel.catalogue_agreement import reference_report
          output = Path('.tmp/library-import-walk/catalogues')
          output.mkdir(parents=True, exist_ok=True)
          for name in ('people-mv', 'bahra-mv'):
              (output / (name + '.json')).write_text(json.dumps(reference_report(name), ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Verify transcribed values against pinned manufacturer PDFs
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p .tmp/catalogue-source-audit
          python scripts/verify_catalogue_originals.py --output .tmp/catalogue-source-audit/report 2>&1 | tee .tmp/catalogue-source-audit/audit.log
      - name: Verify LV, 35 kV and 220 kV imports against official originals
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 10
        shell: bash
        run: |
          python scripts/verify_import_originals.py --output .tmp/catalogue-source-audit/imports 2>&1 | tee .tmp/catalogue-source-audit/imports.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() && runner.os == 'Linux' }}
        with:
          name: library-import-verification
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/library-import-walk/
            .tmp/library-release-acceptance/
            .tmp/catalogue-source-audit/
            .data/release/engineering.seed.json
          if-no-files-found: error
      - uses: actions/cache/restore@v4
        id: occt
        with:
          path: |
            .data/occt-toolchain
            .data/occt-downloads
            frontend/src/features/cad/node_modules/.cache/cablesim-occt
          key: release-occt-${{ runner.os }}-${{ hashFiles('frontend/src/features/cad/native/**', 'frontend/src/features/cad/prepare-runtime.mjs', 'scripts/prepare_release_frontend.py', 'scripts/release_toolchains.json') }}
      - name: Prepare verified OCCT assets from pinned sources
        run: python scripts/prepare_release_frontend.py --jobs 4 --download-cache .data/occt-downloads
      - name: Preserve verified OCCT assets before installation checks
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .data/occt-toolchain
            .data/occt-downloads
            frontend/src/features/cad/node_modules/.cache/cablesim-occt
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - uses: actions/cache@v4
        with:
          path: .data/python-downloads
          key: release-python-${{ runner.os }}-${{ hashFiles('scripts/python_runtime.lock.json') }}
      - name: Build the shipped frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build:release -- --outDir ../.data/release/frontend --emptyOutDir
      - name: Build a platform-specific offline release archive
        run: python scripts/build_release.py --frontend-dist .data/release/frontend --output artifacts/CableSimPro-${{ runner.os }}.zip
      - name: Prepare evidence tools using the actual bundled Python and shipped wheels
        run: python scripts/prepare_release_verifier.py --archive artifacts/CableSimPro-${{ runner.os }}.zip --directory .data/release-verifier
      - name: Public shell launcher with no system Python or Node and only loopback (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # This is the bundled evidence interpreter, NOT actions/setup-python.
          # The gate installs a separate fresh ZIP through its actual start.sh.
          evidence_python="$PWD/.data/release-verifier/CableSimPro/.venv/bin/python"
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            "$evidence_python" scripts/verify_installation.py \
            --archive artifacts/CableSimPro-Linux.zip \
            --output artifacts/installation-Linux \
            --require-offline linux-network-namespace
      - name: Public cmd launcher with no system Python or Node and blocked egress (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Both the evidence driver and application use the shipped runtime.
          # The gate calls start.cmd in a child with no Python/py/Node on PATH.
          # Firewall rules include base executables as well as venv redirectors.
          & ".data/release-verifier/CableSimPro/.venv/Scripts/python.exe" scripts/verify_installation.py `
            --archive artifacts/CableSimPro-Windows.zip `
            --output artifacts/installation-Windows `
            --require-offline windows-firewall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CableSimPro-release-${{ runner.os }}
          retention-days: 14
          path: |
            artifacts/CableSimPro-${{ runner.os }}.zip
            artifacts/CableSimPro-${{ runner.os }}.zip.json
            artifacts/CableSimPro-${{ runner.os }}.source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CableSimPro-installation-${{ runner.os }}
          retention-days: 14
          path: |
            artifacts/installation-${{ runner.os }}/
            artifacts/firewall-preflight-${{ runner.os }}/
            artifacts/release-restart-${{ runner.os }}.xml
          if-no-files-found: error
