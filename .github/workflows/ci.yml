name: CableSimPro CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Hygiene and plugin catalog checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      E2E_DEV: '1'
      E2E_DATABASE_SOURCE: ${{ github.workspace }}/.data/release/engineering.sqlite
      WORKBENCH_PHASE: before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python scripts/check_hygiene.py
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - name: Plugin catalog seals match committed sources
        run: python scripts/seal_plugin_catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            studio/package-lock.json
      - name: Frontend style rules, types and unit tests
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run check:styles
          npx tsc -b
          npm test
      - name: Prepare real isolated workbench data and Chromium
        id: workbench-environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1 fonts-noto-cjk
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry --with-tests
          mkdir -p .data/release .data/workbench-walk/logs
          .venv/bin/python frontend/scripts/seed-engineering-demo.py --release --database .data/release/engineering.sqlite
          cd frontend
          if [ ! -x /usr/bin/google-chrome ]; then npx playwright install --with-deps chromium; fi
      - name: Walk ampacity research at both screen sizes
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:workbench-research 2>&1 | tee ../.data/workbench-walk/logs/research.log
      - name: Walk type design at both screen sizes
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:workbench-types 2>&1 | tee ../.data/workbench-walk/logs/types.log
      - name: Walk resources at both screen sizes
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:workbench-resources 2>&1 | tee ../.data/workbench-walk/logs/resources.log
      - name: Walk simulation preflight without submitting a solver
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:workbench-simulation 2>&1 | tee ../.data/workbench-walk/logs/simulation.log
      - name: Upload the four walkthroughs before the broader audits
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-walk-${{ env.WORKBENCH_PHASE }}
          retention-days: 14
          include-hidden-files: true
          path: .data/workbench-walk/
      - name: Audit visible text
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        env:
          VISIBLE_TEXT_PASS: before
        run: npm run test:visible-text 2>&1 | tee ../.data/workbench-walk/logs/visible-text.log
      - name: Audit interface regularity
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        env:
          REGULARITY_PASS: before
        run: npm run test:regularity 2>&1 | tee ../.data/workbench-walk/logs/regularity.log
      - name: Audit rendering performance
        if: ${{ !cancelled() && steps.workbench-environment.outcome == 'success' }}
        working-directory: frontend
        env:
          PERFORMANCE_PASS: before
        run: npm run test:performance 2>&1 | tee ../.data/workbench-walk/logs/performance.log
      - name: Upload workbench screenshots, real request records and audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-evidence
          retention-days: 14
          include-hidden-files: true
          path: |
            .data/workbench-walk/
            .data/fix-round/shared-shell/visible-text/
            .data/fix-round/shared-shell/regularity/
            .data/fix-round/shared-shell/performance/
      - name: Cable Studio types, build and real-flow tests
        working-directory: studio
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
  native-plugins:
    name: Native plugins / Slurm dg83
    runs-on: [self-hosted, linux, cablesim-hpc]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Submit frozen native regressions to dg83
        run: python scripts/run_plugin_tests_hpc.py --profile "$CABLESIM_HPC_PROFILE" --wall-seconds 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugins-slurm
          retention-days: 14
          path: .data/hpc/native-tests/
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Prepare the declared geometry environment separately from the host Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxrender1
          python scripts/prepare_plugin_environment.py cablesim.cable-geometry --with-tests
      - run: python -m pytest -n "$(python -c 'import os; print(min(3, os.cpu_count() or 1))')" --junitxml=artifacts/backend-${{ matrix.python }}.xml
      - name: Run direct CAD assertions in the declared geometry environment
        run: .venv/bin/python -m pytest -n 0 tests/test_cable_geometry.py tests/test_installation_scene.py tests/test_geometry_preview.py --junitxml=artifacts/cad-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.python }}
          retention-days: 14
          path: artifacts/
  verified-demo:
    name: Package only after every check passes
    needs: [hygiene, native-plugins, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: CableSimPro-demo
          retention-days: 14
          path: artifacts/CableSimPro-demo.zip
          if-no-files-found: error
