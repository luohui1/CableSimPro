name: CableSimPro CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  frontend-environment:
    name: Prepare frontend migration environment
    if: github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive the exact review source
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-environment"
          git archive --format=zip --output="$RUNNER_TEMP/frontend-environment/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/frontend-environment/source-sha.txt"
      - name: Resolve public migration dependencies without lifecycle scripts
        working-directory: frontend
        run: |
          npm install --ignore-scripts --save-exact next@16.3.8 echarts@6.1.0 --cache "$RUNNER_TEMP/npm-cache" --no-audit --no-fund
          npm install --ignore-scripts --save-dev --save-exact @tailwindcss/postcss@4.3.3 --cache "$RUNNER_TEMP/npm-cache" --no-audit --no-fund
          cp package.json package-lock.json "$RUNNER_TEMP/frontend-environment/"
          tar -czf "$RUNNER_TEMP/frontend-environment/npm-cache.tar.gz" -C "$RUNNER_TEMP/npm-cache" _cacache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-migration-environment
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/frontend-environment/
  hygiene:
    name: Hygiene and plugin catalog checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python scripts/check_hygiene.py
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - name: Plugin catalog seals match committed sources
        run: python scripts/seal_plugin_catalog.py
  frontend:
    name: Frontend build and workbench interactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - name: Create an empty source database, not engineering fixtures
        run: python -c "import os,sqlite3; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'cablesim-empty.sqlite'; db=sqlite3.connect(p); db.execute('VACUUM'); db.close()"
      - name: Isolated workbench browser checks without solver calls
        env:
          E2E_DATABASE_SOURCE: ${{ runner.temp }}/cablesim-empty.sqlite
        run: npm run test:workbench-browser
  workbench-screenshots:
    name: GitHub runner UI screenshots
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Create screenshot-only gallery placeholders
        shell: bash
        run: |
          mkdir -p frontend/src/features/cad/node_modules/.cache/gallery
          printf '%s' '{"sections":[],"cable_types":[],"circuits":[]}' > frontend/src/features/cad/node_modules/.cache/gallery/document.json
          printf '%s' '{"layers":[]}' > frontend/src/features/cad/node_modules/.cache/gallery/model.json
          printf '%s' '{"layers":[]}' > frontend/src/features/cad/node_modules/.cache/gallery/updated-model.json
          printf '%s' '{"objects":[]}' > frontend/src/features/cad/node_modules/.cache/gallery/scene.json
      - name: Run real workbench in GitHub VM and capture pages
        shell: bash
        run: |
          DB="$RUNNER_TEMP/cablesim-screenshot.sqlite"
          python -c "import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); db.execute('VACUUM'); db.close()" "$DB"
          CABLESIM_DB="$DB" python -m uvicorn backend.main:app --host 127.0.0.1 --port 8040 > "$RUNNER_TEMP/cablesim-backend.log" 2>&1 &
          BACKEND_PID=$!
          (cd frontend && BACKEND_URL=http://127.0.0.1:8040 npm run dev -- --host 127.0.0.1 --port 5173) > "$RUNNER_TEMP/cablesim-frontend.log" 2>&1 &
          FRONTEND_PID=$!
          cleanup() { kill "$FRONTEND_PID" "$BACKEND_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in {1..120}; do
            curl -fsS http://127.0.0.1:8040/api/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8040/api/health >/dev/null
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          E2E_ISOLATED=1 FRONTEND_URL=http://127.0.0.1:5173 node frontend/scripts/verify-workbench.mjs
      - name: Upload GitHub VM screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-screenshots
          retention-days: 7
          path: .data/frontend-handoff/github-workbench/
          if-no-files-found: error
  native-plugins:
    name: Native plugins / Slurm dg83
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, cablesim-hpc]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Submit frozen native regressions to dg83
        run: python scripts/run_plugin_tests_hpc.py --profile "$CABLESIM_HPC_PROFILE" --wall-seconds 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugins-slurm
          retention-days: 14
          path: .data/hpc/native-tests/
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest --junitxml=artifacts/backend-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.python }}
          retention-days: 14
          path: artifacts/
  verified-demo:
    name: Package only after every check passes
    needs: [hygiene, frontend, native-plugins, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: CableSimPro-demo
          retention-days: 14
          path: artifacts/CableSimPro-demo.zip
          if-no-files-found: error
