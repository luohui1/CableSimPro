name: White workbench review
on:
  push:
    branches: ['design/white-workbench-v077']
permissions:
  contents: read
concurrency:
  # Preserve evidence from distinct source revisions; duplicate runs of one SHA cancel.
  group: white-workbench-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: design
            files: white-workbench.spec.ts industrial-workbench.spec.ts
          - suite: compatibility
            files: light-studio.spec.ts dual-mode.spec.ts engineering-pulse.spec.ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: pip install -r backend/requirements-dev.txt
      - run: node scripts/test_design_tokens.mjs
      - run: node scripts/test_visual_geometry.mjs
      - run: python -m pytest --junitxml=artifacts/backend.xml
        if: matrix.suite == 'design'
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Real workbench, mode switch and accessibility regressions
        run: npx playwright test ${{ matrix.files }} --config=playwright.white.config.ts
        working-directory: frontend
      - name: Fixed-source review bundle
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=tar.gz HEAD > artifacts/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: white-workbench-${{ matrix.suite }}
          path: |
            artifacts/
            frontend/test-results-white/
            frontend/playwright-report-white/
          retention-days: 7
