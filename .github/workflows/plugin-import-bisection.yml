name: Native dependency bisection
on:
  push:
    branches: ['feat/plugin-workspace-integration-v01']
    paths: ['scripts/probe_native_imports.py', '.github/workflows/plugin-import-bisection.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        casadi: ['3.6.7', '3.7.2', '3.8.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements-dev.txt -r plugins/requirements-native.txt casadi==${{ matrix.casadi }}
      - run: python scripts/probe_native_imports.py
      - if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          python -m pip freeze > artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-import-bisection-${{ matrix.casadi }}
          retention-days: 7
          path: artifacts/
