name: Docs site to GitHub Pages
# Builds the documentation site for GitHub Pages on main or on manual dispatch.
# Publishing is opt-in: the deploy job runs only when the repository variable
# DOCS_PAGES_ENABLED is 'true' and Pages uses "GitHub Actions" as its source
# (see site/src/content/docs/install/docs-site.md). Pull requests are covered
# by the "Docs site" job in ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-pages
  cancel-in-progress: false
jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install host dependencies used to export the API reference
        run: |
          pip install -r backend/requirements.txt
          python -c "from pathlib import Path; Path('.data').mkdir(exist_ok=True)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Read the Pages address (only when publishing is enabled)
        id: pages
        if: ${{ vars.DOCS_PAGES_ENABLED == 'true' }}
        uses: actions/configure-pages@v6
      - name: Build the site for the Pages address and check internal information
        working-directory: site
        env:
          PYTHON: python
          DOCS_SITE: ${{ steps.pages.outcome == 'success' && steps.pages.outputs.origin || format('https://{0}.github.io', github.repository_owner) }}
          # A custom domain reports an empty base_path, which means the site root.
          DOCS_BASE: ${{ steps.pages.outcome == 'success' && format('{0}/', steps.pages.outputs.base_path) || format('/{0}/', github.event.repository.name) }}
        run: |
          npm ci
          npm run build
          npm run check:links
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out/
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ vars.DOCS_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
