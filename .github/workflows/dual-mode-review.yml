name: Apply dual mode browser review
on:
  push:
    branches: ['feat/dual-mode-v071']
    paths: ['.github/workflows/dual-mode-review.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/dual-mode-v071'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified review changes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          data=(root/'.development/dual-mode-review.xz').read_bytes()
          assert len(data)==7312
          assert hashlib.sha256(data).hexdigest()=='84cecd924eb30f7a8ef7e2d2611199bf4759895fd9fa9480f59351f6f50773fe'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(data,max_length=50000)
          assert decoder.eof and len(raw)==24618
          payload=json.loads(raw)
          assert set(payload['hashes'])=={'frontend/src/StudioState.tsx','frontend/src/dual-mode/AgentWorkspace.tsx','frontend/src/dual-mode/dual-mode.css','frontend/pro-e2e/dual-mode.spec.ts'}
          subprocess.run(['git','apply','--check','-'],input=payload['patch'].encode(),check=True)
          subprocess.run(['git','apply','-'],input=payload['patch'].encode(),check=True)
          for name,h in payload['hashes'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==h,name
          print('Verified task inspection result, compact review layout and native option-state assertions.')
          PY
      - name: Commit reviewed source and remove one-time tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/StudioState.tsx frontend/src/dual-mode/AgentWorkspace.tsx frontend/src/dual-mode/dual-mode.css frontend/pro-e2e/dual-mode.spec.ts
          git rm .development/dual-mode-review.xz .github/workflows/dual-mode-review.yml
          git commit -m 'fix: compact task approval, current inspection output and native option checks'
          git push origin HEAD:refs/heads/feat/dual-mode-v071
          echo "Reviewed source $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
