name: Professional engineering workbench review
on:
  push:
    branches: ['design/professional-engineering-v1']
permissions:
  contents: read
concurrency:
  group: professional-design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/plugin_sdk.py verify
      - run: python -m pytest --junitxml=artifacts/backend-tests.xml
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: frontend
      - name: Browser workflow and visual review
        run: npx playwright test --config=playwright.workflow.config.ts
        working-directory: frontend
      - name: Capture source and review artifacts
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=zip -o artifacts/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-workbench-review
          retention-days: 7
          path: |
            artifacts/
            frontend/test-results-workflow/
            frontend/dist/
