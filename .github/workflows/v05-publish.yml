name: Publish verified v05 source
on:
  push:
    branches: ['feat/engineering-workspace-v05']
    paths: ['.github/workflows/v05-publish.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/engineering-workspace-v05'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply authored source patch
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          data = b''.join((root / f'.development/v05/{i:02}.bin').read_bytes() for i in range(8))
          assert len(data) == 57796
          assert hashlib.sha256(data).hexdigest() == '000203be38d10804a1c97be8213e6387ac54c1f0d7816566cd66c04c07f759dd'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw = decoder.decompress(data, max_length=400000)
          assert decoder.eof and len(raw) == 226840
          payload = json.loads(raw)
          assert len(payload['hashes']) == 36
          for name in payload['hashes']:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'backend','frontend','scripts','docs','tests','.github','README.md'}
              assert p.suffix not in {'.ttf','.otf','.woff','.woff2','.db','.sqlite'}
          subprocess.run(['git','apply','--check','-'], input=payload['patch'].encode(), check=True)
          subprocess.run(['git','apply','-'], input=payload['patch'].encode(), check=True)
          for name, expected in payload['hashes'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          print('Verified 36 authored source files. No user data or dependencies in patch.')
          PY
      - name: Lock full frontend dependency tree
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit source on feature branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md backend frontend scripts docs tests
          git diff --cached --stat
          git commit -m 'feat: engineering task workspace, generated 3D models, shared runtime and traceable design basis'
          git push origin HEAD:refs/heads/feat/engineering-workspace-v05
          echo "Published source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
