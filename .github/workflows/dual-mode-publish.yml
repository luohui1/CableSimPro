name: Publish reviewed dual mode source
on:
  push:
    branches: ['feat/dual-mode-v071']
    paths: ['.github/workflows/dual-mode-publish.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'luohui1/CableSimPro' && github.ref == 'refs/heads/feat/dual-mode-v071'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify authored source patch
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          data=b''.join((root/f'.development/v071/{i:02}.bin').read_bytes() for i in range(5))
          assert len(data)==28988
          assert hashlib.sha256(data).hexdigest()=='adfd72eaef4ef3b04ef873ac9d407ce4661375586d393fa7c97028791d671f30'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(data,max_length=200000)
          assert decoder.eof and len(raw)==111662
          payload=json.loads(raw)
          assert len(payload['hashes'])==23
          for name in payload['hashes']:
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'backend','frontend','scripts','docs','tests','README.md'}
              assert p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.eot','.db','.sqlite'}
          subprocess.run(['git','apply','--check','-'],input=payload['patch'].encode(),check=True)
          subprocess.run(['git','apply','-'],input=payload['patch'].encode(),check=True)
          for name,h in payload['hashes'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==h,name
          print('Verified 23 authored source and test files. No credentials, user files or fonts.')
          PY
      - name: Commit readable source on feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md backend frontend scripts docs tests
          git diff --cached --stat
          git commit -m 'feat: dual mode entry and shared engineering task session'
          git push origin HEAD:refs/heads/feat/dual-mode-v071
          echo "Published source $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
