<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>型号与研究工作区</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;600&display=swap">
<style>
/* Project workspace: model tree | model canvas (+ docked criteria) | inspector.
   Calm rules: one toolbar row (views only), drawing tools float inside the canvas, sources are icons,
   the tree expands only the group of the current view, criteria table has four columns. */
:root {
  --ground: #F9F9F9; --surface: #FFFFFF; --fill: #F4F4F4; --hover: #ECECEC; --current: #ECECEC;
  --line: #ECECEC; --line-2: #D9D9D9; --text: #0D0D0D; --text-2: #5D5D5D; --text-3: #8F8F8F; --inverse: #FFFFFF;
  --run: #B4612A; --on-run: #FFF8F2; --agent: #0F7C8A;
  --ok: #2F7A4F; --warn: #A4560B; --warn-soft: #FBF1E4; --bad: #B8352B;
  --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --m-cu: #C47A3D; --m-semi: #2B2E33; --m-xlpe: #ECEAE4; --m-screen: #AEB5BD; --m-jacket: #24272B; --soil: #EFEBE4; --sand: #F7F3EC;
  --pa: #B38F00; --pb: #2E8B57; --pc: #C0392B;
  --sans: "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #181818; --surface: #212121; --fill: #2A2A2A; --hover: #2F2F2F; --current: #303030;
  --line: #2F2F2F; --line-2: #424242; --text: #ECECEC; --text-2: #B4B4B4; --text-3: #8F8F8F; --inverse: #0D0D0D;
  --run: #E08A4C; --on-run: #1A0F08; --agent: #4FC3CF; --ok: #4CC184; --warn: #EDA246; --warn-soft: #33281A; --bad: #F07468;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --m-xlpe: #3A3934; --m-semi: #0B0C0E; --m-jacket: #08090A; --soil: #2C2A26; --sand: #2E2B26; --pa: #E3C02E; --pb: #52B37A; --pc: #F07468; color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #181818; --surface: #212121; --fill: #2A2A2A; --hover: #2F2F2F; --current: #303030;
  --line: #2F2F2F; --line-2: #424242; --text: #ECECEC; --text-2: #B4B4B4; --text-3: #8F8F8F; --inverse: #0D0D0D;
  --run: #E08A4C; --on-run: #1A0F08; --agent: #4FC3CF; --ok: #4CC184; --warn: #EDA246; --warn-soft: #33281A; --bad: #F07468;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --m-xlpe: #3A3934; --m-semi: #0B0C0E; --m-jacket: #08090A; --soil: #2C2A26; --sand: #2E2B26; --pa: #E3C02E; --pb: #52B37A; --pc: #F07468; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--text); font: 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.wrap { padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 12px; max-width: 1480px; margin: 0 auto; }
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 0 4px; }
.bar h1 { font-size: 16px; font-weight: 600; margin: 0; }
.bar span { color: var(--text-2); font-size: 13px; }
.seg { display: inline-flex; padding: 3px; background: var(--fill); border-radius: 999px; gap: 2px; }
.seg button { height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.scroll, .scrollx { overflow-x: auto; }

.app { width: 1400px; height: 900px; display: grid; grid-template-columns: 56px minmax(0, 1fr); background: var(--ground); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; }
.rail .r { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-2); }
.rail .r.cur { background: var(--current); color: var(--text); }
.rail .sp { flex: 1; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.s { width: 16px; height: 16px; }
.win { margin: 8px 8px 8px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: grid; grid-template-rows: 52px minmax(0, 1fr) 30px; min-width: 0; overflow: hidden; }
.head { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--line); }
.head .name { font-weight: 600; font-size: 15px; white-space: nowrap; }
.head .task { color: var(--text-2); white-space: nowrap; }
.head .sp { flex: 1; }
.vsep { width: 1px; height: 20px; background: var(--line); }
.btn { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
.btn:hover { background: var(--hover); }
.btn--pri { background: var(--text); border-color: var(--text); color: var(--inverse); font-weight: 600; }
.btn--run { background: var(--run); border-color: var(--run); color: var(--on-run); font-weight: 600; }
.btn--run::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 30%, transparent); }
.btn--ag { border-color: var(--agent); color: var(--agent); }
.main { display: grid; grid-template-columns: 240px minmax(0, 1fr) 288px; min-height: 0; }

.tree { border-right: 1px solid var(--line); overflow: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 1px; }
.tg { display: flex; align-items: center; height: 30px; padding: 0 8px; font-size: 13px; color: var(--text-3); margin-top: 10px; }
.tg:first-child { margin-top: 0; }
.tn { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; cursor: pointer; }
.tn:hover { background: var(--hover); }
.tn.cur { background: var(--current); font-weight: 600; }
.tn .lbl { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.tn .meta { color: var(--text-3); font-size: 13px; }
.tn.l2 { padding-left: 34px; }
.caret { width: 14px; height: 14px; color: var(--text-3); flex: none; }
.caret.closed { transform: rotate(-90deg); }
.d { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; position: relative; }
.d--now { background: var(--text); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--text); }
.d--old { box-shadow: inset 0 0 0 1.5px var(--text-2); }
.d--draft { border: 1.5px dashed var(--warn); }
.d--bad { box-shadow: inset 0 0 0 1.5px var(--bad); }
.d--bad::after { content: ""; position: absolute; left: 4.25px; top: -1px; width: 1.5px; height: 12px; background: var(--bad); transform: rotate(45deg); }
.c { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.c--ok { background: var(--ok); } .c--warn { background: var(--warn); } .c--bad { background: var(--bad); } .c--na { box-shadow: inset 0 0 0 1.5px var(--text-2); }
.si { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }

.center { display: grid; grid-template-rows: 48px minmax(0, 1fr) 196px; min-width: 0; min-height: 0; }
.vbar { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.vbar .sp { flex: 1; }
.overlay { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); white-space: nowrap; }
.overlay b { color: var(--text); font-weight: 600; }
.canvas { position: relative; background: var(--surface); min-height: 0; overflow: hidden; }
.canvas > svg { display: block; width: 100%; height: 100%; }
.canvas svg text { font-family: var(--mono); }
.float { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-1); }
.tool { height: 32px; min-width: 32px; padding: 0 8px; border-radius: 999px; border: 0; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.tool.on { background: var(--current); color: var(--text); }
.float .vsep { margin: 0 4px; height: 18px; }
.ro { position: absolute; left: 14px; top: 14px; font-size: 13px; color: var(--text-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.bottom { border-top: 1px solid var(--line); display: grid; grid-template-rows: 44px minmax(0, 1fr); min-height: 0; }
.btabs { display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.btabs b { font-size: 14px; }
.btabs .sp { flex: 1; }
.btabs .more { color: var(--text-2); font-size: 13px; }
.bpane { overflow: auto; padding: 0 4px; }
.crit { width: 100%; border-collapse: collapse; }
.crit td { height: 36px; padding: 0 12px; border-top: 1px solid var(--line); white-space: nowrap; }
.crit .n { text-align: right; font-family: var(--mono); }
.crit .m { color: var(--text-2); font-size: 13px; margin-left: 8px; font-family: var(--mono); }
.crit tr.pick td { background: var(--fill); }
.cu { color: var(--run); font-weight: 600; }
.badv { color: var(--bad); font-weight: 600; }

.insp { border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; }
.insp__h { padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.insp__h b { font-size: 16px; } .insp__h span { color: var(--text-2); font-size: 13px; }
.grp { padding: 12px 16px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.grp__t { font-size: 13px; color: var(--text-3); }
.prop { display: grid; grid-template-columns: 84px minmax(0, 1fr) 18px; gap: 8px; align-items: center; min-height: 32px; }
.prop > span:first-child { color: var(--text-2); font-size: 13px; }
.inp { height: 32px; border: 1px solid var(--line-2); border-radius: 8px; display: flex; align-items: center; padding: 0 10px; gap: 6px; font-family: var(--mono); min-width: 0; }
.inp small { margin-left: auto; color: var(--text-2); font-size: 12px; }
.inp--lock { border-color: transparent; background: var(--fill); color: var(--text-2); }
.val { font-family: var(--mono); }
.srcic { color: var(--text-3); display: inline-flex; }
.srcic svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.link { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.sw { width: 32px; height: 18px; border-radius: 999px; background: var(--line-2); position: relative; display: inline-block; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw.on { background: var(--text); } .sw.on::after { left: 16px; background: var(--inverse); }
.hint { color: var(--text-2); font-size: 13px; }
.srckey { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text-3); font-size: 13px; margin-top: auto; }
.srckey span { display: inline-flex; align-items: center; gap: 4px; }
/* variants: every candidate re-checked against every criterion */
.varwrap { height: 100%; overflow: auto; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.varhead { display: flex; align-items: baseline; gap: 12px; }
.varhead b { font-size: 16px; } .varhead span { color: var(--text-2); font-size: 13px; }
.vm { width: 100%; border-collapse: separate; border-spacing: 0; }
.vm th, .vm td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; font-size: 13px; }
.vm th:first-child, .vm td:first-child { text-align: left; color: var(--text-2); position: sticky; left: 0; background: var(--surface); }
.vm thead th { vertical-align: top; font-weight: 400; border-bottom: 1px solid var(--line-2); }
.vm .vt { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.vm .vt b { font-size: 13px; color: var(--text); }
.vm .vt span { color: var(--text-2); font-size: 12px; white-space: normal; max-width: 120px; line-height: 1.35; }
.vm td .v { font-family: var(--mono); }
.vm .cur { background: var(--fill); }
.vm .okcol { box-shadow: inset 0 2px 0 var(--ok); }
.vm .ag { color: var(--agent); font-size: 12px; }
.vm tfoot td { border-bottom: 0; padding-top: 12px; }
.cell { display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.bar2 { display: flex; height: 22px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line-2); }
.bar2 i { display: block; height: 100%; }
.bar2 i.lk { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.18) 0 2px, transparent 2px 6px); }
.legend2 { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; font-size: 13px; align-items: center; }
.legend2 i { width: 10px; height: 10px; border-radius: 2px; box-shadow: 0 0 0 1px var(--line-2); }
.legend2 em { font-style: normal; font-family: var(--mono); color: var(--text-2); }
.btn--sm { height: 28px; padding: 0 10px; font-size: 13px; }
.status { display: flex; align-items: center; gap: 18px; padding: 0 16px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 13px; font-family: var(--mono); white-space: nowrap; }
.status .sp { flex: 1; }

.head .kind { font-size: 13px; color: var(--text-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.mtitle { font-size: 15px; font-weight: 600; margin-right: 6px; white-space: nowrap; }
.tn .cur2, .tn.cur2 { font-weight: 600; color: var(--text); }
.tn.l2 { color: var(--text-2); }
.tn.l2.cur2 { color: var(--text); }
.addm { color: var(--text-2); margin-top: 6px; }
.pagewrap { height: 100%; overflow: auto; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.phead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.phead b { font-size: 16px; } .phead span { color: var(--text-2); font-size: 13px; }
.phead .vr { margin-left: auto; }
.tbl2 { width: 100%; border-collapse: collapse; }
.tbl2 th, .tbl2 td { height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl2 th { font-size: 13px; font-weight: 400; color: var(--text-2); height: 34px; }
.tbl2 .n { text-align: right; font-family: var(--mono); }
.inp { white-space: nowrap; overflow: hidden; }
.vm .vt span { max-width: 96px; }
.vm th, .vm td { padding: 8px 8px; }
.tbl2 .mut, .mut { color: var(--text-2); }
.tbl2 tr.pick td { background: var(--fill); }
.tbl2.stale td.n { color: var(--text-3); }
.note-old { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--fill); color: var(--text-2); }
.empty2 { margin: auto; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--text-2); }
.empty2 b { color: var(--text); font-size: 16px; }
.row2 { display: flex; gap: 8px; }
.concl2 { display: flex; align-items: flex-end; gap: 24px; padding: 14px 0 6px; border-top: 1px solid var(--text); }
.concl2 > div:first-child { display: flex; flex-direction: column; gap: 2px; }
.concl2 b { font: 600 28px/1.1 var(--mono); color: var(--run); }
.concl2 b small { font: 500 14px var(--mono); color: var(--text-2); margin-left: 4px; }
.mut2 { display: flex; flex-direction: column; gap: 4px; color: var(--text-2); }
.meta2 { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 0; }
.meta2 dt { color: var(--text-2); } .meta2 dd { margin: 0; }
.vr { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--text-2); font-size: 13px; }
.heatwrap2 { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 16px; max-width: 760px; }
.heatwrap2 canvas { width: 100%; aspect-ratio: 560 / 380; border-radius: 10px; border: 1px solid var(--line); display: block; }
.cbar2 { display: grid; grid-template-columns: 14px auto; gap: 8px; }
.cbar2 i { border-radius: 3px; background: linear-gradient(0deg, #FBF3E4, #F2C98A 25%, #E58B47 50%, #C2452F 72%, #6E1F35 90%, #2A0F1E); }
.cbar2 div { display: flex; flex-direction: column; justify-content: space-between; font: 13px var(--mono); color: var(--text-2); }
.form2 { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.homewrap { overflow: auto; padding: 56px 72px; display: flex; flex-direction: column; gap: 22px; max-width: 1040px; width: 100%; margin: 0 auto; }
.homewrap h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; text-align: center; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.choice { text-align: left; border: 1px solid var(--line-2); border-radius: 16px; padding: 22px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.choice:hover { background: var(--fill); }
.choice b { font-size: 18px; } .choice > span:not(.choice__ic) { color: var(--text-2); }
.choice em { font-style: normal; font-size: 13px; color: var(--text-3); }
.choice__ic { width: 40px; height: 40px; border-radius: 12px; background: var(--fill); display: flex; align-items: center; justify-content: center; }
.h2r { display: flex; align-items: baseline; gap: 12px; margin-top: 12px; } .h2r b { font-size: 16px; } .h2r .mut { font-size: 13px; }

.tabbar { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.tabs2 { display: flex; gap: 2px; align-self: stretch; }
.tabs2 button { border: 0; background: none; padding: 0 12px; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; height: 100%; white-space: nowrap; }
.tabs2 button:hover { color: var(--text); }
.tabs2 button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.checks { border-top: 1px solid var(--line); }
.checks.open .bpane { max-height: 190px; overflow: auto; }
.checkbar { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; white-space: nowrap; }
.lnk { border: 0; background: none; color: var(--text-2); cursor: pointer; }
.lnk:hover { color: var(--text); }
.insp--min { display: flex; flex-direction: column; align-items: center; padding-top: 16px; gap: 12px; }
.vlabel { writing-mode: vertical-rl; color: var(--text-2); font-size: 13px; }
.hint2 { writing-mode: vertical-rl; color: var(--text-3); font-size: 12px; }
.canvas.plain { background: var(--surface); }
.dimedit { display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 10px; border: 2px solid var(--text); border-radius: 17px; background: var(--surface); font: 13px var(--mono); color: var(--text-2); }
.dimedit input { width: 56px; border: 0; outline: 0; font: inherit; background: transparent; color: var(--text); }
.dimchip:hover rect { fill: var(--hover); }
.minitb { display: flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-1); width: max-content; margin: 0 auto; }
.minitb button { width: 32px; height: 32px; border: 0; border-radius: 999px; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.minitb button:hover { background: var(--hover); color: var(--text); }
.cellin { display: inline-block; min-width: 72px; padding: 2px 8px; border: 1px solid var(--line-2); border-radius: 6px; text-align: right; font-family: var(--mono); }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.thumb { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.thumb span { color: var(--text-2); font-size: 13px; } .thumb .mono { font-family: var(--mono); color: var(--text); }
.formgrid { display: flex; flex-direction: column; gap: 8px; max-width: 460px; }
.prop2 { border: 1px dashed var(--agent); background: color-mix(in srgb, var(--agent) 8%, var(--surface)); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
.prop2 b { color: var(--agent); display: inline-flex; align-items: center; gap: 8px; }
.a4mini { width: 420px; aspect-ratio: 210 / 297; background: #FFFFFF; color: #1A1C1F; border: 1px solid var(--line); margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 8px; }
.a4mini span { color: #5D5D5D; font-size: 13px; }

/* on-canvas editing of the selected cable: driving dimensions + a mini toolbar */
function ampSection2() {
  let o = ampSection(true).replace('</svg>', '');
  const L = 44, T0 = 26, sc = 660, X = x => L + (W - L) / 2 + x * sc, Z = z => T0 + (-0.42 - z) * sc, rr = 0.0283 * sc;
  const chip = (key, x, y, val, label) => S.edit === key
    ? `<foreignObject x="${x - 50}" y="${y - 17}" width="100" height="34"><div xmlns="http://www.w3.org/1999/xhtml" class="dimedit"><input value="${val}" data-dimin="${key}" autofocus/><span>m</span></div></foreignObject>`
    : `<g class="dimchip" data-dim="${key}" style="cursor:text"><rect x="${x - 34}" y="${y - 13}" width="68" height="26" rx="13" fill="var(--surface)" stroke="var(--text)" stroke-width="1"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="13" fill="var(--text)">${val}</text></g><text x="${x}" y="${y + 28}" text-anchor="middle" font-size="11" font-family="Noto Sans SC, sans-serif" fill="var(--text-3)">${label}</text>`;
  // spacing B–C and depth of B, shown only because B is selected
  const ys = Z(-.8) + rr + 30;
  o += `<g stroke="var(--text)" stroke-width=".9"><line x1="${X(0)}" y1="${Z(-.8) + rr + 8}" x2="${X(0)}" y2="${ys + 5}"/><line x1="${X(.12)}" y1="${Z(-.8) + rr + 8}" x2="${X(.12)}" y2="${ys + 5}"/><line x1="${X(0)}" y1="${ys}" x2="${X(.12)}" y2="${ys}"/></g>`;
  o += chip('spacing', X(.06), ys + 26, '0.120', '间距 · 双击修改');
  const xd = X(-.45);
  o += `<g stroke="var(--text)" stroke-width=".9" fill="none"><line x1="${xd}" y1="${T0 + 4}" x2="${xd}" y2="${Z(-.8)}"/><line x1="${xd}" y1="${Z(-.8)}" x2="${X(0) - rr - 8}" y2="${Z(-.8)}" stroke-dasharray="3 3"/><path d="M${xd - 4} ${T0 + 12} L${xd} ${T0 + 4} L${xd + 4} ${T0 + 12}"/></g>`;
  o += chip('depth', xd, (T0 + Z(-.8)) / 2, '0.800', '埋深 · 双击修改');
  // mini toolbar next to the selection
  o += `<foreignObject x="${X(0) - 92}" y="${Z(-.8) - rr - 58}" width="184" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="minitb"><button title="复制">${ic('copy', 1)}</button><button title="排成品字形">${ic('tri', 1)}</button><button title="对齐">${ic('align', 1)}</button><button title="删除">${ic('trash', 1)}</button></div></foreignObject>`;
  return o + '</svg>';
}

    if (t === 'params') return frame3({ ...base, content: page(`<div class="formgrid">${prop('任务', inp('目标电流校核'))}${prop('目标电流', inp('600', 'A'))}${prop('方法', inp('IEC 60287 · 单芯直埋'))}${prop('导体 R₂₀', inp('0.0283', 'Ω/km'), 'lib')}${prop('频率', inp('50', 'Hz'))}${prop('温度限值', inp('90', '°C'), 'std')}</div><span class="hint">电缆、敷设与工况参数只读引用，去对应模块修改。</span>`), insp: null, status: '' });
    if (t === 'loss') return frame3({ ...base, content: page(`<div class="phead"><span>600 A 运行工况 · W/m</span></div>` + tbl(['分项', '#A 相', '#B 相', '#C 相'], [['导体', '25.4', '25.6', '25.4'], ['介质', '0.01', '0.01', '0.01'], ['金属屏蔽', '1.8', '1.8', '1.8'], ['合计', '27.2', '27.4', '27.2']]) + `<div class="phead"><span>热阻 · K·m/W</span></div>` + tbl(['热路', '#值'], [['绝缘 T₁', '0.290'], ['外护套 T₃', '0.123'], ['外部 T₄（含互热）', '1.81']])), insp: null, status: '' });
    return frame3({ ...base, content: page(tbl(['轮次', '#电流 A', '#屏蔽温度 °C', '#损耗因数'], [['1', '551.0', '70.0', '0.070'], ['2', '551.5', '81.4', '0.068'], ['3', '551.5', '81.4', '0.068']]) + `<span class="hint">已收敛（3 轮）；数值按物理量精度显示，完整精度在运行记录里。</span>`), insp: null, status: '' });

  if (m === 'cable') {
    if (t === 'sec') return frame3({ ...base, canvas: 1, content: desSection(), insp: `<div class="insp__h"><b>引用的型号</b><span>型号库 · 已发布</span></div><div class="grp">${prop('型号', '<span class="link">YJV 26/35 kV 1×630</span>', 'lock')}${prop('版本', inp('v11', '', 1), 'lock')}</div>`, inspOpen: true, status: '<span>引用 · 只读</span>' });

    return frame3({ ...base, content: page(tbl(['型号', '#版本', '状态', '说明'], [['YJV 26/35 kV 1×630', 'v11', crit('ok', '已发布 · 锁定'), '型号库有 v12 草稿，不影响本研究']])), insp: null, status: '' });
  }
  if (m === 'cond') return frame3({ ...base, content: page(`<div class="formgrid">${prop('负荷电流', inp('600', 'A'))}${prop('负荷率', inp('1.00'))}${prop('地温', inp('25.0', '°C'))}${prop('土壤热阻率', inp('1.20', 'K·m/W'), 'doc')}${prop('导体限值', inp('90', '°C'), 'std')}</div>`), insp: null, status: '' });

const S = { tab: 'study', type: { m: 'structure', t: 'sec' }, study: { m: 'section', t: 'sec' }, checks: false, edit: null };
const TABSOF = (tab, m) => (tab === 'type' ? TTABS : STABS)[m] || [];
const keyOf = () => S.tab === 'home' ? 'home' : `${S.tab}-${S[S.tab].m}-${S[S.tab].t || 'main'}`;
function parse(h) {
  const [tab, m, t] = h.split('-');
  if (tab === 'home') { S.tab = 'home'; return; }
  if ((tab === 'type' || tab === 'study') && m && (tab === 'type' ? TTABS : STABS)[m]) { S.tab = tab; S[tab].m = m; S[tab].t = t === 'main' ? '' : t; }
}
const app = document.getElementById('app');
function mount() {
  app.innerHTML = S.tab === 'home' ? homeWs() : S.tab === 'type' ? typeWs3(S.type.m, S.type.t) : studyWs3(S.study.m, S.study.t);
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === S.tab)));
  heatField();
  const ed = app.querySelector('[data-dimin]'); if (ed) { ed.focus(); ed.select(); }
}
function go() { S.edit = null; const k = keyOf(); if (location.hash.slice(1) !== k) location.hash = k; else mount(); }
window.addEventListener('hashchange', () => { parse(location.hash.slice(1)); S.edit = null; mount(); });
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { S.tab = b.dataset.t; go(); } });
app.addEventListener('click', e => {
  const st = S[S.tab];
  const g0 = e.target.closest('[data-goto]'); if (g0) { S.tab = g0.dataset.goto; go(); return; }
  const m = e.target.closest('[data-mod]'); if (m && st) { st.m = m.dataset.mod; st.t = (TABSOF(S.tab, st.m)[0] || [''])[0]; go(); return; }
  const t = e.target.closest('[data-tab]'); if (t && st) { st.t = t.dataset.tab; go(); return; }
  if (e.target.closest('[data-checks]')) { S.checks = !S.checks; mount(); return; }
  const g = e.target.closest('[data-go]'); if (g && g.dataset.go === 'v:var') { S.tab = 'type'; S.type.m = 'var'; S.type.t = 'matrix'; go(); }
});
app.addEventListener('dblclick', e => { const d = e.target.closest('[data-dim]'); if (d) { S.edit = d.dataset.dim; mount(); } });
app.addEventListener('keydown', e => { if (e.target.matches('[data-dimin]') && (e.key === 'Enter' || e.key === 'Escape')) { S.edit = null; mount(); } });
if (location.hash.length > 1) parse(location.hash.slice(1));
mount();
</script>
