<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工程插件 · CableSimPro</title>
<style>

:root{color-scheme:light;--ink:#252525;--muted:#707070;--quiet:#929292;--line:#e8e8e8;--paper:#fff;--canvas:#fff;--accent:#606060;--wash:#fafafa;--selected:#f4f4f4;--font:"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;--mono:"Cascadia Code","Consolas",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:13px/1.65 var(--font)}
button,input,a{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
[hidden]{display:none!important}
h1,h2,h3,p,figure{margin:0}svg{display:block;flex-shrink:0}
button{color:inherit}::selection{background:var(--selected)}
.topbar{height:68px;background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{max-width:1480px;margin:auto;padding:0 44px;height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center;font-size:17px;font-weight:600;letter-spacing:-.4px}
.brand-mark{color:var(--ink)}
.top-context{font-size:12px;font-weight:400;letter-spacing:0;margin-left:18px;padding-left:25px;border-left:1px solid var(--line);color:var(--muted)}
.preview{font-size:11px;display:flex;align-items:center;gap:9px;color:var(--muted)}
.preview:before{content:"";width:5px;height:5px;background:var(--muted);border-radius:50%}
.layout{max-width:1480px;margin:auto;padding:36px 44px 28px;display:grid;grid-template-columns:176px minmax(0,1fr);gap:40px}
.sidebar{position:sticky;top:30px;align-self:start}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;font-weight:400;color:var(--muted)}
.side-heading{font-size:12px;color:var(--muted);margin:5px 0 15px}
.search-box{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:4px;background:var(--paper);margin-bottom:26px}
.search-box svg{color:var(--muted)}.search-box input{width:100%;min-width:0;border:0;outline:0;background:none;font-size:12px;color:var(--ink)}
.search-box:focus-within{border-color:var(--ink);outline:1px solid var(--ink)}
.filter{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 11px;margin:4px 0;border:0;border-left:2px solid transparent;background:none;text-align:left;font-size:13px}
.filter[aria-pressed=true]{border-left-color:var(--ink);background:var(--selected);color:var(--ink)}
.filter .num{color:var(--muted);font:10px var(--mono)}
.side-guide{margin-top:46px;padding-top:20px;border-top:1px solid var(--line)}
.side-guide h2{font-size:11px;font-weight:500;color:var(--muted);margin-bottom:19px}
.guide-step{display:flex;gap:11px;position:relative;padding-bottom:24px}
.guide-step:not(:last-child):after{content:"";position:absolute;left:8px;top:23px;bottom:4px;width:1px;background:var(--line)}
.guide-dot{font:9px var(--mono);width:17px;height:17px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-top:2px}
.guide-step strong{font-size:12px;font-weight:500}.guide-step small{display:block;margin-top:3px;font-size:10px;color:var(--muted)}
.side-note{font-size:10px;color:var(--muted);line-height:1.9;margin-top:20px}
.back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:5px 0 22px}
.back svg{transform:rotate(180deg)}
.side-plugin{display:flex;align-items:center;gap:9px;padding:11px 8px;margin:4px 0;font-size:13px;border-left:2px solid transparent}
.side-plugin svg{color:var(--accent)}
.side-plugin[aria-current=page]{background:var(--selected);border-left-color:var(--ink)}
.side-plugin .side-number{font:9px var(--mono);color:var(--muted);margin-left:auto}
.side-plugin:hover{background:var(--selected)}
.main-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:1px 0 25px}
h1{font-size:29px;letter-spacing:-1px;font-weight:600;line-height:1.5;margin:6px 0}
.subtitle{color:var(--muted);font-size:12px;margin-top:8px}
.totals{display:flex;gap:24px;padding-bottom:4px;white-space:nowrap}
.totals b{display:block;font:25px var(--mono);letter-spacing:-1px;font-weight:400;color:var(--muted)}
.totals span{display:block;font-size:10px;color:var(--muted);margin-top:6px}
.collection-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.collection-line span:last-child{font:10px var(--mono);letter-spacing:1px;color:var(--muted)}
.plugin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.plugin{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;display:block;position:relative}
.plugin:hover{border-color:var(--accent);box-shadow:0 3px 10px #00000008}
.module-art{height:166px;position:relative;background:var(--wash);color:var(--accent);overflow:hidden}
.module-meta{position:absolute;left:15px;right:15px;top:12px;display:flex;justify-content:space-between;align-items:center;z-index:1}
.module-code{font:9px var(--mono);letter-spacing:1px;opacity:.8}
.module-mode{font-size:10px;padding:2px 7px;background:var(--paper);border:1px solid var(--line);border-radius:4px;line-height:1.5;color:var(--muted)}
.module-art>.diagram{width:100%;height:168px;margin-top:11px}
.module-info{padding:17px 18px 14px}
.module-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.module-title h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.module-title>svg{color:var(--muted)}
.module-info p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8;min-height:22px}
.module-foot{margin-top:15px;padding-top:10px;display:flex;align-items:center;justify-content:space-between}
.module-stage{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px}
.module-en{display:none}
.catalog-footer{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:23px;padding-top:17px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
.empty{padding:76px 30px;text-align:center;border:1px solid var(--line);background:var(--paper);grid-column:1/-1}
.empty h2{font-size:17px;font-weight:500}.empty p{margin:10px 0 20px;color:var(--muted)}.text-button{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.breadcrumb{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:10px;margin:3px 0 19px}
.breadcrumb a:hover{text-decoration:underline}.breadcrumb span{color:var(--muted)}
.detail-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:28px}
.detail-heading h1{font-size:30px;margin:4px 0 7px}
.detail-heading .eyebrow{color:var(--accent)}
.detail-heading .subtitle{margin-top:0;font-size:13px}
.delivery{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap;margin-top:27px}
.delivery i{width:6px;height:6px;border:1px solid var(--quiet);border-radius:50%;background:var(--line)}
.detail-tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin:27px 0 23px}
.detail-tabs button{padding:11px 0 12px;border:0;background:none;color:var(--muted);position:relative;font-size:13px}
.detail-tabs button[aria-selected=true]{color:var(--ink);font-weight:600}
.detail-tabs button[aria-selected=true]:after{content:"";position:absolute;height:2px;left:0;right:0;bottom:-1px;background:var(--accent)}
.panel{min-height:410px}
.overview{display:grid;grid-template-columns:1.08fr 1fr;gap:32px}
.technical-figure{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:var(--accent);position:relative}
.figure-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;font-size:10px;gap:12px}
.figure-top span:last-child{font:9px var(--mono);letter-spacing:1px;opacity:.6}
.technical-figure .diagram{width:100%;height:252px}
.diagram [data-part]{transition:opacity .16s ease}
.diagram[data-active="0"] [data-part]:not([data-part="0"]),.diagram[data-active="1"] [data-part]:not([data-part="1"]),.diagram[data-active="2"] [data-part]:not([data-part="2"]){opacity:.23}
.diagram .leader{stroke-width:.75;opacity:.7}
.layer-buttons{display:flex;padding:0 18px;gap:16px;flex-wrap:wrap}
.layer-button{padding:8px 0;border:0;border-bottom:1px solid transparent;background:none;font-size:11px;color:var(--accent);opacity:.75}
.layer-button[aria-pressed=true]{opacity:1;border-bottom-color:currentColor}
.layer-note{font-size:12px;line-height:1.9;min-height:68px;padding:13px 18px 16px;color:var(--muted)}
.feature-intro{font-size:13px;color:var(--muted);line-height:1.95;padding:1px 0 19px;border-bottom:1px solid var(--line)}
.feature-row{display:grid;grid-template-columns:24px 1fr;gap:12px;padding-top:19px}
.feature-number{font:10px var(--mono);color:var(--quiet);padding-top:4px}
.feature-row h3{font-size:14px;font-weight:600;margin-bottom:4px}
.feature-row p{font-size:12px;color:var(--muted);line-height:1.85}
.position{margin-top:29px}
.section-label{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:500;margin-bottom:13px;color:var(--muted)}
.section-label span{font:9px var(--mono);color:var(--quiet)}
.position-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:13px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0}
.position-flow>a,.position-current{display:flex;align-items:center;gap:10px;font-size:11px}
.position-flow>a:hover{text-decoration:underline;text-underline-offset:4px}
.position-current{color:var(--accent);font-weight:600}
.position-flow>svg{color:var(--quiet);width:14px}
.position-flow small{display:block;font-size:9px;color:var(--muted);font-weight:400}
.detail-bottom{display:flex;justify-content:space-between;gap:25px;color:var(--muted);font-size:10px;margin-top:23px;padding-bottom:15px}
.detail-bottom a{text-decoration:underline;text-underline-offset:4px}
.workflow{display:grid;grid-template-columns:228px 1fr;gap:32px}
.steps{display:flex;flex-direction:column}
.step-button{padding:17px 12px;display:flex;align-items:flex-start;gap:13px;text-align:left;background:none;border:0;border-left:2px solid var(--line)}
.step-button[aria-pressed=true]{border-left-color:var(--accent);background:var(--wash)}
.step-index{font:12px var(--mono);color:var(--muted);margin-top:2px}
.step-button strong{display:block;font-size:13px;font-weight:500}
.step-button small{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.step-display{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:27px 30px;min-height:330px}
.step-display h2{font-size:22px;font-weight:500;margin:10px 0 14px}
.step-display>p{font-size:12px;color:var(--muted);line-height:1.95}
.step-exchange{display:flex;align-items:center;justify-content:center;gap:28px;background:var(--wash);padding:23px;margin:24px 0;color:var(--accent)}
.step-exchange span{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:10px}
.step-exchange>svg{width:28px}
.step-outcome{padding-top:15px;border-top:1px solid var(--line);display:flex;gap:20px;align-items:baseline}
.step-outcome strong{font-size:10px;font-weight:400;color:var(--muted)}
.step-outcome span{font-size:12px;color:var(--ink)}
.contract-grid{display:grid;grid-template-columns:1.25fr .85fr;gap:32px}
.contract-grid h2,.scope-layout h2{font-size:16px;font-weight:500;margin:0 0 10px}
.section-summary{font-size:11px;color:var(--muted);margin-bottom:21px}
.input-table{border-collapse:collapse;width:100%;font-size:11px;table-layout:fixed}
.input-table th{text-align:left;font-size:10px;font-weight:400;color:var(--muted);background:var(--selected);padding:10px}
.input-table th:first-child{width:27%}.input-table th:nth-child(2){width:28%}
.input-table td{padding:15px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted);line-height:1.85}
.input-table td:first-child{color:var(--ink);font-weight:500}
.input-table tbody th{background:none;border-bottom:1px solid var(--line);vertical-align:top;padding:15px 10px;color:var(--ink);font-size:11px;font-weight:500}
.paper-preview{border:1px solid var(--line);background:#fff;padding:24px 25px;position:relative;min-height:340px}
.paper-preview:after{content:"";position:absolute;left:8px;right:8px;bottom:-7px;height:5px;border:1px solid var(--line);border-top:0;background:var(--paper)}
.paper-preview .eyebrow{font-size:9px;color:var(--muted)}
.paper-preview h3{font-size:17px;font-weight:500;padding:13px 0 18px;border-bottom:2px solid var(--quiet)}
.artifact-item{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:16px 0;font-size:11px}
.artifact-item span{font:9px var(--mono);color:var(--muted)}
.paper-note{font-size:10px;line-height:1.9;margin-top:18px;color:var(--muted)}
.input-note{margin-top:20px;font-size:11px;line-height:1.9;color:var(--muted)}
.scope-layout{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.scope-section{border-top:2px solid var(--quiet);padding-top:19px}
.scope-section.boundary{border-top-color:var(--quiet)}
.scope-list{list-style:none;padding:0;margin:20px 0 0}
.scope-list li{display:flex;gap:10px;margin:15px 0;font-size:12px;color:var(--muted);line-height:1.9}
.scope-list li:before{content:"";flex-shrink:0;width:5px;height:5px;border:1px solid var(--quiet);margin-top:8px;border-radius:50%}
.boundary .scope-list li:before{border-radius:0;border-color:var(--quiet)}
.scope-callout{margin-top:25px;padding:19px 22px;background:var(--selected);font-size:11px;line-height:1.9;color:var(--muted);border-left:2px solid var(--quiet)}
.scope-callout strong{font-weight:500;display:block;margin-bottom:4px;color:var(--ink)}
@media(min-width:1600px){.layout{padding-top:45px}.module-art{height:184px}.module-art>.diagram{height:182px}.module-info{padding:21px}.technical-figure .diagram{height:280px}}
@media(max-width:1250px){.layout{padding:28px;grid-template-columns:155px minmax(0,1fr);gap:26px}.top-inner{padding:0 28px}.plugin-grid{gap:13px}.module-info{padding:15px 13px}.module-en{font-size:7px}.module-title h2{font-size:14px}.module-foot{gap:5px}.overview,.contract-grid{gap:22px}.workflow{grid-template-columns:190px 1fr;gap:22px}.detail-heading h1{font-size:27px}.layer-buttons{gap:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>
</head>

<header class="topbar"><div class="top-inner">

<main id="app"></main>

    '<g data-part="1"><path d="M176 78h70a23 46 0 0 1 0 92h-70" fill="var(--wash)"/><ellipse cx="176" cy="124" rx="23" ry="46" fill="var(--paper)"/><ellipse cx="176" cy="124" rx="14" ry="29"/><path d="M185 74V52h49" class="leader"/></g>'+
    '<g data-part="0"><path d="M232 98h53a14 26 0 0 1 0 52h-53" fill="var(--wash)"/><ellipse cx="232" cy="124" rx="14" ry="26" fill="var(--paper)"/>'+[[-5,-9],[4,-12],[-6,5],[5,4],[0,16]].map(([x,y])=>'<ellipse cx="'+(232+x)+'" cy="'+(124+y)+'" rx="3" ry="6" fill="currentColor" stroke="none"/>').join('')+'<path d="M285 151v33h38" class="leader"/></g>'+
    '<path d="M79 208h215m-215-5v10m215-10v10" stroke-width=".8" opacity=".45"/>';
  }else if(p.key==="iec"){
    content='<g data-part="0">'+core(122,89,29)+core(91,143,29)+core(153,143,29)+'<path d="M58 189h128m-128-4v8m128-8v8" class="leader"/></g>'+
    '<g data-part="1"><path d="M191 123h34m-5-4 5 4-5 4"/><circle cx="246" cy="123" r="12" fill="var(--wash)"/><path d="m243 116-4 8h8l-4 8" stroke-width="1.5"/></g>'+
    '<g data-part="2"><path d="M258 123h23v-31m0-31v-8h33m-33 39-5-4 10-5-10-5 10-5-5-7m0 59v31m0 31v8h33m-33-39-5 4 10 5-10 5 10 5-5 7"/><path d="M316 44v18m5-15v12m-5 126v18m5-15v12"/></g>';
  }else if(p.key==="thermal"){
    content='<g data-part="2">'+circle(158,125,83)+'<path d="M56 214h224m-224-4v8m224-8v8" class="leader"/><path d="M246 82h42m-5-4 5 4-5 4M249 126h39m-5-4 5 4-5 4M243 171h45m-5-4 5 4-5 4"/></g>'+
    '<g data-part="1">'+circle(158,125,61,"var(--wash)")+circle(158,125,43,"var(--paper)")+'<path d="M192 65h33v-29h36M194 164h31v27h31" class="leader"/></g>'+
    '<g data-part="0">'+circle(158,125,23,"var(--wash)")+'<path d="m152 135 8-20m-15 12h23M134 125h-20m5-4-5 4 5 4M158 99V81m-4 5 4-5 4 5" stroke-width="1.5"/></g>';
  }else if(p.key==="mesh"){
    const pts=[[62,45],[109,45],[164,45],[217,45],[292,45],[62,92],[109,87],[160,99],[222,87],[292,98],[62,144],[113,147],[166,146],[222,139],[292,145],[62,198],[116,198],[171,198],[230,198],[292,198]];
    let lines="";
    for(let row=0;row<3;row++)for(let col=0;col<4;col++){
      const a=pts[row*5+col],b=pts[row*5+col+1],c=pts[(row+1)*5+col],d=pts[(row+1)*5+col+1];
      lines+='<path d="M'+a+'L'+b+'L'+d+'L'+c+'Z M'+(col%2?a:c)+'L'+(col%2?d:b)+'"/>';
    }
    content='<g data-part="2"><path d="M109 87 160 99 166 146 113 147Z" fill="currentColor" opacity=".18"/><path d="M222 87 292 98 292 145 222 139Z" fill="currentColor" opacity=".09"/></g><g data-part="1" stroke-width=".8">'+lines+pts.map(([x,y])=>circle(x,y,2,"var(--paper)")).join('')+'</g><g data-part="0"><path d="M62 45h230v153H62z" stroke-width="1.8"/><path d="M47 45h-9v153h9" class="leader"/></g>';
  }else if(p.key==="simulation"){
    content='<g data-part="2"><path d="M48 47h268v159H48z" stroke-dasharray="3 4"/><path d="M48 34h268M48 29v10m268-10v10" class="leader"/></g><g data-part="1">'+[1,.78,.56].map((s,i)=>'<ellipse cx="173" cy="133" rx="'+(119*s)+'" ry="'+(64*s)+'" fill="'+(i===0?'var(--wash)':'none')+'" transform="rotate(-9 173 133)" opacity="'+(.5+i*.2)+'"/>').join('')+'<path d="M71 176c36 27 95 23 135 9" stroke-dasharray="3 4"/></g><g data-part="0">'+core(150,134,17)+core(186,120,17)+'<path d="M170 91V65h68" class="leader"/></g>';
  }else{

  }
  return '<svg class="diagram" data-active="'+active+'" viewBox="0 0 360 250" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 33V21h12m294 0h12v12M21 217v12h12m294 0h12v-12" opacity=".28" stroke-width=".8"/>'+content+'</svg>';
}


const $=s=>document.querySelector(s);
const app=$("#app");
const tabs=[["overview","功能概览"],["workflow","使用流程"],["contract","输入与交付"],["scope","适用边界"]];
const state={filter:"all",query:"",parts:{},steps:{},focus:null,lastKey:null,scroll:0};
const theme=()=>"--accent:#606060;--wash:#fafafa;";
const byKey=key=>plugins.find(p=>p.key===key);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function route(){
  const bits=location.hash.slice(1).split("/");
  const plugin=bits[0]==="plugin"?byKey(bits[1]):null;
  return {plugin,tab:tabs.some(t=>t[0]===bits[2])?bits[2]:"overview"};
}
function card(p){
  return '<a class="plugin" href="#plugin/'+p.key+'" data-key="'+p.key+'" style="'+theme(p)+'" aria-label="'+p.name+'，查看详情">'+
  '<div class="module-art"><div class="module-meta"><span class="module-code">CSP / '+p.number+'</span><span class="module-mode">'+p.mode+'</span></div>'+drawing(p)+'</div>'+
  '<div class="module-info"><div class="module-title"><h2>'+p.name+'</h2>'+arrow+'</div><p>'+p.desc+'</p>'+
  '<div class="module-foot"><span class="module-stage">'+glyph(p,12)+p.stage+'</span><span class="module-en">'+p.en+'</span></div></div></a>';
}
function renderCatalog(){
  const items=plugins.filter(p=>(state.filter==="all"||(state.filter==="core"?p.mode==="内置":p.mode!=="内置"))&&
    (p.name+" "+p.en+" "+p.desc+" "+p.cap+" "+p.stage).toLowerCase().includes(state.query.toLowerCase().trim()));
  const filterName=state.filter==="all"?"全部工程能力":state.filter==="core"?"随软件提供的核心能力":"按需选用的扩展能力";
  app.innerHTML='<div class="main-head"><div><div class="eyebrow">CABLESIM / MODULE LIBRARY</div><h1 id="page-title" tabindex="-1">工程插件</h1><p class="subtitle">从定义一根电缆，到交付一份有据可查的计算书。</p></div>'+
    '<div class="totals" aria-label="4 项内置，2 项扩展"><div><b>04</b><span>核心内置</span></div><div><b>02</b><span>可选扩展</span></div></div></div>'+
    '<div class="collection-line"><span id="result-count" role="status">'+filterName+' · '+items.length+' 项'+(state.query?' / “'+esc(state.query)+'”':'')+'</span><span>EXPLORE THE MODULES</span></div>'+
    '<div class="plugin-grid">'+(items.length?items.map(card).join(""):'<div class="empty"><h2>没有找到对应插件</h2><p>试试“热分析”“建模”或“IEC”。</p><button type="button" class="text-button" id="clear-search">清除搜索与筛选</button></div>')+'</div>'+
    '<footer class="catalog-footer"><span>点击插件，了解它在工程中承担的工作。</span><span>功能归并设计 · 非已安装状态</span></footer>';
}
function overview(p){
  const active=state.parts[p.key]??-1;
  const parts=['<button type="button" class="layer-button" data-part-button="-1" aria-pressed="'+(active===-1)+'">整体</button>'].concat(p.layers.map((name,i)=>'<button type="button" class="layer-button" data-part-button="'+i+'" aria-pressed="'+(active===i)+'">'+name+'</button>')).join("");
  const related=p.related.map(byKey);
  return '<div class="overview"><figure class="technical-figure"><div class="figure-top"><span>结构与方法示意</span><span>FIG. '+p.number+' / NOT TO SCALE</span></div><div id="figure-art">'+drawing(p,active)+'</div><div class="layer-buttons" role="group" aria-label="查看示意图组成">'+parts+'</div><figcaption class="layer-note" id="layer-note" aria-live="polite">'+(active===-1?'点击上方标签，查看各部分的作用。图形仅作介绍，不表示实际计算结果。':p.layerNotes[active])+'</figcaption></figure>'+
    '<div><p class="feature-intro">'+p.intro+'</p>'+p.features.map((text,i)=>'<section class="feature-row"><span class="feature-number">0'+(i+1)+'</span><div><h3>'+p.featureTitles[i]+'</h3><p>'+text+'</p></div></section>').join('')+'</div></div>'+
    '<section class="position"><h2 class="section-label"><span>CONNECTIONS</span>可搭配的工程能力</h2><div class="position-flow">'+
    '<a href="#plugin/'+related[0].key+'">'+glyph(related[0],22)+'<div><small>相关插件</small>'+related[0].name+'</div></a><svg width="20" height="10" viewBox="0 0 20 10" aria-hidden="true"><path d="M0 5h20" stroke="currentColor"/></svg>'+
    '<div class="position-current">'+glyph(p,22)+'<div><small>当前插件</small>'+p.name+'</div></div><svg width="20" height="10" viewBox="0 0 20 10" aria-hidden="true"><path d="M0 5h20" stroke="currentColor"/></svg>'+
    '<a href="#plugin/'+related[1].key+'">'+glyph(related[1],22)+'<div><small>相关插件</small>'+related[1].name+'</div></a></div></section>';
}
function stepDisplay(p,index){
  const step=p.steps[index];
  return '<div class="eyebrow">STEP 0'+(index+1)+' / 04</div><h2>'+step[0]+'</h2><p>'+step[1]+'</p>'+
    '<div class="step-exchange"><span>'+glyph(p,30)+'当前工程上下文</span>'+arrow+'<span><svg width="29" height="32" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M4 2h11l5 5v19H4zM15 2v5h5M7 12h10M7 16h10M7 20h6"/></svg>'+step[0]+'</span></div>'+
    '<div class="step-outcome"><strong>此步形成</strong><span>'+step[2]+'</span></div>';
}
function workflow(p){
  const current=state.steps[p.key]??0;
  return '<div class="workflow"><div class="steps" role="group" aria-label="使用步骤">'+p.steps.map((step,i)=>
    '<button class="step-button" type="button" data-step="'+i+'" aria-controls="step-display" aria-pressed="'+(current===i)+'"><span class="step-index">0'+(i+1)+'</span><span><strong>'+step[0]+'</strong><small>'+step[2]+'</small></span></button>').join('')+
    '</div><section class="step-display" id="step-display" aria-live="polite">'+stepDisplay(p,current)+'</section></div>'+
    '<div class="input-note">流程介绍仅展示操作与交付关系；实际执行在工程工作台内完成。</div>';
}
function contract(p){
  return '<div class="contract-grid"><section><h2>从工程中读取什么</h2><p class="section-summary">输入绑定明确来源；数值参数需带单位。</p><table class="input-table"><thead><tr><th scope="col">输入项</th><th scope="col">来源</th><th scope="col">用途</th></tr></thead><tbody>'+
    p.inputs.map(row=>'<tr>'+row.map((text,i)=>'<'+(i===0?'th scope="row"':'td')+'>'+text+'</'+(i===0?'th':'td')+'>').join('')+'</tr>').join('')+
    '</tbody></table><p class="input-note">'+p.detail+'</p></section>'+
    '<figure class="paper-preview"><div class="eyebrow">OUTPUT / '+p.en+'</div><h3>这项能力的交付内容</h3>'+p.artifacts.map((item,i)=>'<div class="artifact-item"><span>0'+(i+1)+'</span>'+item+'</div>').join('')+
    '<figcaption class="paper-note">交付结构示意。实际工件由执行结果决定，并关联相应输入与方法版本。</figcaption></figure></div>';
}
function scope(p){
  return '<div class="scope-layout"><section class="scope-section"><h2>适用范围</h2><p class="section-summary">'+p.scope+'</p><ul class="scope-list">'+p.supported.map(t=>'<li>'+t+'</li>').join('')+'</ul></section>'+
    '<section class="scope-section boundary"><h2>使用前需要知道</h2><p class="section-summary">方法能力与交付方式分别确认。</p><ul class="scope-list">'+p.limits.map(t=>'<li>'+t+'</li>').join('')+'</ul></section></div>'+
    '<div class="scope-callout"><strong>'+p.mode+' · '+(p.mode==="内置"?'随软件交付':'按研究需要选择')+'</strong>'+
    (p.mode==="内置"?'核心能力的适用范围仍由具体方法决定，使用前需要完成参数与工况检查。':'启用前需要核对依赖和运行环境；扩展工件与核心研究共享同一份工程上下文。')+'</div>';
}
function renderDetail(p,tab){
  app.style.cssText=theme(p);
  const next=plugins[(plugins.indexOf(p)+1)%plugins.length];
  app.innerHTML='<nav class="breadcrumb" aria-label="当前位置"><a href="#catalog">插件目录</a><span>/</span>'+p.name+'</nav>'+
    '<header class="detail-heading"><div><div class="eyebrow">MODULE '+p.number+' / '+p.en+'</div><h1 id="page-title" tabindex="-1">'+p.name+'</h1><p class="subtitle">'+p.caption+'</p></div><div class="delivery"><i></i>'+p.mode+' · '+(p.mode==="内置"?'随软件提供':'按需选择')+'</div></header>'+
    '<div class="detail-tabs" role="tablist" aria-label="插件介绍章节">'+tabs.map(([key,label])=>'<button type="button" role="tab" id="tab-'+key+'" data-tab="'+key+'" aria-controls="detail-panel" aria-selected="'+(key===tab)+'" tabindex="'+(key===tab?'0':'-1')+'">'+label+'</button>').join('')+'</div>'+
    '<section class="panel" id="detail-panel" role="tabpanel" aria-labelledby="tab-'+tab+'" tabindex="0">'+({overview,workflow,contract,scope}[tab](p))+'</section>'+
    '<footer class="detail-bottom"><span>功能归并设计 · 介绍中的图形与流程均为示意</span><a href="#plugin/'+next.key+'">下一项：'+next.name+' →</a></footer>';
}
function render(){
  const {plugin,tab}=route();
  $("#catalog-controls").hidden=!!plugin;
  $("#detail-nav").hidden=!plugin;
  if(plugin){
    $("#detail-nav").innerHTML='<a class="back" href="#catalog">'+arrow+'返回插件目录</a><div class="side-heading">工程能力 / MODULES</div>'+plugins.map(p=>'<a class="side-plugin" href="#plugin/'+p.key+'" '+(p.key===plugin.key?'aria-current="page"':'')+' style="'+theme(p)+'">'+glyph(p,17)+'<span>'+p.name+'</span><span class="side-number">'+p.number+'</span></a>').join('')+
      '<div class="side-guide"><div class="eyebrow">ONE ENGINEERING CONTEXT</div><p class="side-note">所有能力围绕同一份工程。<br>输入有来源，结果可追溯。</p></div>';
    renderDetail(plugin,tab);
    document.title=plugin.name+' · CableSimPro';
    if(state.focus==="tab")$('#tab-'+tab).focus({preventScroll:true});
    else if(state.focus)$("#page-title").focus({preventScroll:true});
  }else{
    app.removeAttribute("style");
    renderCatalog();
    document.title="工程插件 · CableSimPro";
    if(state.lastKey){
      const card=document.querySelector('.plugin[data-key="'+state.lastKey+'"]');
      if(card)card.focus({preventScroll:true});
    }
  }
  if(state.focus==="page")window.scrollTo(0,plugin?0:state.scroll);
  state.focus=null;
}
document.addEventListener("click",event=>{
  const card=event.target.closest(".plugin[data-key]");
  if(card){state.lastKey=card.dataset.key;state.scroll=scrollY;}
  const nav=event.target.closest('a[href^="#"]');
  if(nav)state.focus="page";
  const filter=event.target.closest("[data-filter]");
  if(filter){
    state.filter=filter.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b===filter)));
    renderCatalog();
  }
  if(event.target.closest("#clear-search")){
    state.filter="all";state.query="";$("#search").value="";
    document.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.filter==="all")));
    renderCatalog();$("#search").focus();
  }
  const tab=event.target.closest("[data-tab]");
  if(tab){
    state.focus="tab";
    location.hash="plugin/"+route().plugin.key+"/"+tab.dataset.tab;
  }
  const part=event.target.closest("[data-part-button]");
  if(part){
    const p=route().plugin,index=Number(part.dataset.partButton);state.parts[p.key]=index;
    $("#figure-art").innerHTML=drawing(p,index);
    document.querySelectorAll("[data-part-button]").forEach(b=>b.setAttribute("aria-pressed",String(b===part)));
    $("#layer-note").textContent=index===-1?"点击上方标签，查看各部分的作用。图形仅作介绍，不表示实际计算结果。":p.layerNotes[index];
  }
  const step=event.target.closest("[data-step]");
  if(step){
    const p=route().plugin,index=Number(step.dataset.step);state.steps[p.key]=index;
    document.querySelectorAll("[data-step]").forEach(b=>b.setAttribute("aria-pressed",String(b===step)));
    $("#step-display").innerHTML=stepDisplay(p,index);
  }
});
document.addEventListener("keydown",event=>{
  if(!event.target.matches("[data-tab]"))return;
  const index=tabs.findIndex(t=>t[0]===event.target.dataset.tab);
  const direction={ArrowRight:1,ArrowLeft:-1}[event.key];
  let next=direction===undefined?null:(index+direction+tabs.length)%tabs.length;
  if(event.key==="Home")next=0;
  if(event.key==="End")next=tabs.length-1;
  if(next!==null){event.preventDefault();document.querySelector('[data-tab="'+tabs[next][0]+'"]').click();}
});
$("#search").addEventListener("input",event=>{state.query=event.target.value;renderCatalog();});
window.addEventListener("hashchange",render);
render();

</script>
</body>
</html>
